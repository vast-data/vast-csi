{{/* Vast CSI Node */}}

{{- $csi_images := .Values.image -}}
{{- $kubelet_path := .Values.kubeletPath | default "/var/lib/kubelet" | trimSuffix "/" }}
{{- $ca_bundle := empty .Values.sslCert | ternary .Values.sslCertsSecretName "csi-vast-ca-bundle" -}}
{{- $driver_name := include "vastcsi.csiDriver" . -}}
{{- $csi_sock := printf "%s.sock" ($driver_name | lower | replace "." "-" | replace "_" "-" | trimSuffix "-" | trimPrefix "-") -}}
{{- $is_nfs_driver := (eq .Values.driverType "nfs") }}
{{- $name_prefix := $is_nfs_driver | ternary "csi" "block" }}
{{- $nfsServices := compact (splitList " " (join " " (default list .Values.node.nfsServices.services))) -}}

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name_prefix }}-vast-node
  namespace: {{ include "vastcsi.namespace" . }}
  labels:
{{ include "vastcsi.labels" . | indent 4 }}
    app.kubernetes.io/csi-role: "node"
spec:
  selector:
    matchLabels:
      app: "{{ $name_prefix }}-vast-node"
{{- include "vastcsi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: {{ $name_prefix }}-vast-node
        role: csi-vast
{{- include "vastcsi.labels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      {{- end }}
      affinity:
        podAffinity:
          {{- toYaml .Values.node.podAffinity | nindent 10 }}
        podAntiAffinity:
          {{- toYaml .Values.node.podAntiAffinity | nindent 10 }}
        nodeAffinity:
          {{- toYaml .Values.node.nodeAffinity | nindent 10 }}
      containers:
      {{- if and $is_nfs_driver .Values.node.nfsServices.enabled }}
        - name: csi-nfs-services
          image: {{ $csi_images.csiVastPlugin.repository | default $csi_images.csiVastPlugin.defaultRepository }}
          imagePullPolicy: {{ $csi_images.csiVastPlugin.imagePullPolicy | default "IfNotPresent" }}
          args:
            - run-nfs-services
            - --services={{ include "vastcsi.nfsServicesArg" . }}
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
{{- if or (has "idmapd" $nfsServices) (has "tlshd" $nfsServices) }}
          volumeMounts:
{{- if has "idmapd" $nfsServices }}
            - name: nfs-state
              mountPath: /var/lib/nfs
              mountPropagation: HostToContainer
            - name: idmapd-conf
              mountPath: /etc/idmapd.conf
              readOnly: true
{{- end }}
{{- if has "tlshd" $nfsServices }}
            - name: tlshd-conf
              mountPath: /etc/tlshd.conf
              readOnly: true
{{- end }}
{{- end }}
          resources: {{- toYaml .Values.node.resources.nfsServices | nindent 12 }}
      {{- end }}
        - name: csi-node-driver-registrar
          image: {{ $csi_images.csiNodeDriverRegistrar.repository | default $csi_images.csiNodeDriverRegistrar.defaultRepository }}
          args:
{{- include "vastcsi.commonArgs" . | nindent 12 }}
            - "--kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)"
          imagePullPolicy: {{ $csi_images.csiNodeDriverRegistrar.imagePullPolicy | default "IfNotPresent" }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "rm -rf /registration/{{ $driver_name }} /registration/{{ $driver_name }}-reg.sock"]
          env:
            - name: ADDRESS
              value: /csi/{{ $csi_sock }}
            - name: DRIVER_REG_SOCK_PATH
              value: {{ $kubelet_path }}/plugins/{{ $driver_name }}/{{ $csi_sock }}
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi/
            - name: registration-dir
              mountPath: /registration/
          resources: {{- toYaml .Values.node.resources.nodeDriverRegistrar | nindent 12 }}
        - name: csi-vast-plugin
          image: {{ $csi_images.csiVastPlugin.repository | default $csi_images.csiVastPlugin.defaultRepository }}
          args:
            - "serve"
            - "--plugin"
            - {{ ternary "nfs" "block" $is_nfs_driver }}
          imagePullPolicy: {{ $csi_images.csiVastPlugin.imagePullPolicy | default "IfNotPresent" }}
          env:
{{- include "vastcsi.commonEnv" . | indent 12 }}
            - name: CSI_ENDPOINT
              value: unix:///csi/{{ $csi_sock }}
            - name: X_CSI_MODE
              value: node
            - name: X_CSI_NODE_ID
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: X_CSI_METRICS_ENABLED
              value: "{{ .Values.node.metrics.enabled }}"
            - name: X_CSI_METRICS_PORT
              value: "{{ .Values.node.metrics.port }}"
{{- if not $is_nfs_driver }}
            - name: X_CSI_BLOCK_HOST_BINARY_SEARCH_DIRS
              value: "{{ .Values.node.hostBinarySearchDirs }}"
{{- end }}
{{- if and $is_nfs_driver .Values.node.nfsServices.enabled }}
            - name: X_CSI_NFS_SERVICES_WAIT
              value: "{{ include "vastcsi.nfsServicesArg" . }}"
{{- end }}
{{- include "vastcsi.fallbackToDeserEnv" . | nindent 12 }}
{{- if .Values.node.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.node.metrics.port }}
              protocol: TCP
{{- end }}
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: {{ $kubelet_path }}
              mountPropagation: "Bidirectional"
            - name: device-dir
              mountPath: /dev
          {{- if not $is_nfs_driver }}
            - name: sys-dir
              mountPath: /sys
            - name: host
              mountPath: /host
              mountPropagation: "Bidirectional"
          {{- else if .Values.node.metrics.enabled }}
            - name: host
              mountPath: /host
              mountPropagation: "Bidirectional"
          {{- end }}
          {{- if and .Values.node.propagateHostMountOptions $is_nfs_driver }}
            - name: host-nfsmount-conf-d
              mountPath: /etc/nfsmount.conf.d
          {{- end }}
          {{- include "vastcsi.vmsAuthVolumeMount" (merge (dict "ca_bundle" $ca_bundle) .) | indent 12 }}
          {{- include "vastcsi.credSerdeVolumeMount" . | indent 12 }}
          resources: {{- toYaml .Values.node.resources.csiVastPlugin | nindent 12 }}
      hostNetwork: true
      hostPID: true
      dnsPolicy: {{ .Values.node.dnsPolicy }}
      nodeSelector:
{{ toYaml .Values.node.nodeSelector | indent 8 }}
      priorityClassName: {{ .Values.node.priorityClassName }}
      serviceAccountName: {{ .Release.Name }}-vast-node-sa
      tolerations:
{{ toYaml .Values.node.tolerations | indent 8 }}
      volumes:
        - name: registration-dir
          hostPath:
            path: {{ $kubelet_path }}/plugins_registry/
            type: DirectoryOrCreate
        - name: plugin-dir
          hostPath:
            path: {{ $kubelet_path }}/plugins/{{ $driver_name }}
            type: DirectoryOrCreate
        - name: pods-mount-dir
          hostPath:
            path: {{ $kubelet_path }}
            type: Directory
        - name: device-dir
          hostPath:
            path: /dev
        {{- if and $is_nfs_driver (has "idmapd" $nfsServices) }}
        - name: nfs-state
          hostPath:
            path: /var/lib/nfs
            type: DirectoryOrCreate
        - name: idmapd-conf
          hostPath:
            path: /etc/idmapd.conf
            type: File
        {{- end }}
        {{- if and $is_nfs_driver (has "tlshd" $nfsServices) }}
        - name: tlshd-conf
          hostPath:
            path: /etc/tlshd.conf
            type: File
        {{- end }}
        {{- if not $is_nfs_driver }}
        - name: sys-dir
          hostPath:
            path: /sys
        - name: host
          hostPath:
            path: /
            type: Directory
        {{- else if .Values.node.metrics.enabled }}
        - name: host
          hostPath:
            path: /
            type: Directory
        {{- end }}
        {{- include "vastcsi.vmsAuthVolume" (merge (dict "ca_bundle" $ca_bundle) .) | indent 8 }}
        {{- include "vastcsi.credSerdeVolume" . | indent 8 }}
        {{- if and .Values.node.propagateHostMountOptions $is_nfs_driver }}
        - name: host-nfsmount-conf-d
          hostPath:
            path: /etc/nfsmount.conf.d
            type: DirectoryOrCreate
        {{- end }}
