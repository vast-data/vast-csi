# Example: flat COSI credentials via envFrom (no JSON parse / initContainer).
#
# Prerequisites:
#   1. Install/upgrade vastcosi with flattener enabled:
#        helm upgrade --install cosi-driver charts/vastcosi -n vast-cosi --create-namespace \
#          --set credsFlattener.enabled=true \
#          -f your-values.yaml
#   2. Apply BucketClass / BucketClaim / BucketAccessClass (see cosi-all-in-one.yaml).
#   3. Apply this file (annotated BucketAccess + sample Pod).
#   4. Wait for Secret/ConfigMap sample-access-secret-flat.
#   5. Smoke: kubectl exec -it deploy/sample-s3-client -- printenv | grep -E 'AWS_|BUCKET_'
#
# Annotation must be exactly "true" (case-sensitive).

---
kind: BucketAccess
apiVersion: objectstorage.k8s.io/v1alpha1
metadata:
  name: sample-access-flat
  annotations:
    cosi.vastdata.com/flatten-credentials: "true"
spec:
  bucketClaimName: sample-bucket
  bucketAccessClassName: sample-bac
  credentialsSecretName: sample-access-secret

---
# Sample client Pod: envFrom flat Secret + ConfigMap (no initContainer).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-s3-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-s3-client
  template:
    metadata:
      labels:
        app: sample-s3-client
    spec:
      containers:
      - name: client
        image: public.ecr.aws/aws-cli/aws-cli:latest
        command: ["sleep", "infinity"]
        envFrom:
        - secretRef:
            name: sample-access-secret-flat
        - configMapRef:
            name: sample-access-secret-flat
