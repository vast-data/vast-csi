                          - KeepEqual
                          - dropequal
                          - DropEqual
                      regex:
                        type: string
                        description: Regular expression against which the extracted value is matched
                      replacement:
                        type: string
                        nullable: true
                        description: Replacement value against which a Replace action is performed if the regex matches. Regex capture groups are available.
                      separator:
                        type: string
                        nullable: true
                        description: Separator placed between concatenated SourceLabels
                      sourceLabels:
                        type: array
                        description: Source labels select values from existing labels, concatenated using the Separator and matched against the Regex
                        items:
                          type: string
                      targetLabel:
                        type: string
                        description: Label to which the resulting string is written in a Replace action. Mandatory for Replace, HashMod, Lowercase, Uppercase, KeepEqual and DropEqual actions
                      modulus:
                        type: integer
                        description: Modulus to take of the hash of the source label values. Only applicable when the action is HashMod
                    x-kubernetes-preserve-unknown-fields: true
    # -- Node -- end ->
    # -- images -- start ->
    image:
      description: |-
        Container images for CSI components. By default the operator manages these
        images and updates them when the operator is upgraded.
      type: object
      properties:
        useCustomRepositories:
          description: |-
            Leave disabled (recommended) so the operator uses the images that ship
            with this operator version and updates them on upgrade. Enable only if
            you need to pull images from a private or custom registry.
          type: boolean
          default: false
        csiAttacher:
          type: object
          properties:
            imagePullPolicy:
              default: {{ .Values.image.csiAttacher.imagePullPolicy }}
              type: string
              enum:
                - Always
                - IfNotPresent
                - Never
            repository:
              description: Custom image. Used only when "Use custom images" is enabled.
              type: string
        csiNodeDriverRegistrar:
          type: object
          properties:
            imagePullPolicy:
              default: {{ .Values.image.csiNodeDriverRegistrar.imagePullPolicy }}
              type: string
              enum:
                - Always
                - IfNotPresent
                - Never
            repository:
              description: Custom image. Used only when "Use custom images" is enabled.
              type: string
        csiProvisioner:
          type: object
          properties:
            imagePullPolicy:
              default: {{ .Values.image.csiProvisioner.imagePullPolicy }}
              type: string
              enum:
                - Always
                - IfNotPresent
                - Never
            repository:
              description: Custom image. Used only when "Use custom images" is enabled.
              type: string
        csiResizer:
          type: object
          properties:
            imagePullPolicy:
              default: {{ .Values.image.csiResizer.imagePullPolicy }}
              type: string
              enum:
                - Always
                - IfNotPresent
                - Never
            repository:
              description: Custom image. Used only when "Use custom images" is enabled.
              type: string
        csiSnapshotter:
          type: object
          properties:
            imagePullPolicy:
              default: {{ .Values.image.csiSnapshotter.imagePullPolicy }}
              type: string
              enum:
                - Always
                - IfNotPresent
                - Never
            repository:
              description: Custom image. Used only when "Use custom images" is enabled.
              type: string
        csiVastPlugin:
          type: object
          properties:
            imagePullPolicy:
              default: {{ .Values.image.csiVastPlugin.imagePullPolicy }}
              type: string
              enum:
                - Always
                - IfNotPresent
                - Never
            repository:
              description: Custom image. Used only when "Use custom images" is enabled.
              type: string
        csiAddonsSidecar:
          type: object
          properties:
            imagePullPolicy:
              default: {{ .Values.image.csiAddonsSidecar.imagePullPolicy }}
              type: string
              enum:
                - Always
                - IfNotPresent
                - Never
            repository:
              description: Custom image. Used only when "Use custom images" is enabled.
              type: string
    # -- images -- end ->
    deletionViewPolicy:
      default: {{ .Values.deletionViewPolicy }}
      description: Dedicated view policy to delete volumes. Driver-wide option. Preferably, utilize the Trash API for volume deletion. If using multiple clusters, ensure a view policy with the same name is created for each cluster.
      type: string
    deletionVipPool:
      default: {{ .Values.deletionVipPool }}
      description: Dedicated VIP pool to delete volumes. Driver-wide option. Preferably, utilize the Trash API for volume deletion. If using multiple clusters, ensure a VIP pool with the same name is created for each cluster.
      type: string
    dontUseTrashApi:
      default: {{ .Values.dontUseTrashApi }}
      description: Whether to use Trash API
      type: boolean
    replicationEnabled:
      type: boolean
      default: {{ .Values.replicationEnabled }}
      description: >-
        Enable VAST asynchronous replication for volumes provisioned by this driver.
        Registers the replication plugin with the cluster VastExtensionsManager,
        which must be installed once per cluster before enabling this option.
    csiAddonsSidecar:
      type: object
      description: Replication plugin sidecar Deployment created when replicationEnabled is true.
      properties:
        operationTimeout:
          type: integer
          format: int32
          default: {{ .Values.csiAddonsSidecar.operationTimeout }}
          description: Timeout for replication operations (seconds).
        resources:
          type: object
          x-kubernetes-preserve-unknown-fields: true
    attachRequired:
      type: boolean
      default: {{ .Values.attachRequired }}
      description: |-
        Indicates whether this CSI driver requires an attach operation, implementing ControllerPublishVolume.
        If set to false, the driver will perform ControllerPublishVolume as part of NodePublishVolume operation,
        potentially speeding up volume attachment where HTTP/HTTPS ports are not open.
    useLocalIpForMount:
      description:  Use this local IP address for mounting, when the StorageClass does not define a vipPool. This is useful for DPU-based deployments.
      type: string
      default: ""
    driverType:
      description: Select the type of driver to deploy.
      type: string
      default: {{ .Values.driverType }}
      enum:
        - nfs
        - block
    secretName:
      description: |-
        Name of the global secret that holds VAST credentials. 
        For improved granularity per StorageClass, it's advisable to define the secret as a VastStorage CRD.
      type: string
      default: {{ .Values.secretName }}
    endpoint:
        description: API endpoint of VAST appliance - should be provided by user if "global" secretName is provided.
        type: string
        default: {{ .Values.endpoint }}
    sslCertsSecretName:
      description: |-
        Name of the secret that holds the SSL certificates for the VAST appliance.
        For improved granularity per StorageClass, it's advisable to define the SSL certificate as a part VastStorage CRD.
      type: string
      default: {{ .Values.sslCertsSecretName }}
    sslCert:
      description: Path (absolute or relative) to SSL certificate for verifying the VAST REST API.
      type: string
      default: {{ .Values.sslCert }}
    verifySsl:
      type: boolean
      default: {{ .Values.verifySsl }}
    numWorkers:
      description: The number of worker threads the CSI plugin use to serve requests simultaneously.
      type: integer
      format: int32
      default: {{ .Values.numWorkers }}
    operationTimeout:
      description: Timeout for all Remote Procedure Call (RPC) requests to the CSI driver.
      type: integer
      format: int32
      default: {{ .Values.operationTimeout }}
    operationRetryIntervalStart:
      description: |-
        Each time a failure occurs, sidecar containers initiate retries
        but only after waiting for 'operationRetryIntervalStart' seconds
        which then doubles with each subsequent failure  until it reaches `operationRetryIntervalMax`
      type: integer
      format: int32
      default: {{ .Values.operationRetryIntervalStart }}
    operationRetryIntervalMax:
      description: Maximum interval between attempts.
      type: integer
      format: int32
      default: {{ .Values.operationRetryIntervalMax }}
    truncateVolumeName:
      description: Truncate VAST quota name if name length is greater than this number. set truncateVolumeName as null to disable truncation.
      type: integer
      format: int32
      default: {{ .Values.truncateVolumeName }}
    blockHostsAutoPrune:
      description: |-
        (Block driver only) If set to true, the CSI driver will automatically prune (delete) host
        entries (NQNs) from the VMS when they are no longer in use by any PVCs on the corresponding
        Kubernetes node. This prevents host sprawl due to unused NQNs automatically generated by the driver.
        This option is particularly useful in Kubernetes environments where nodes are
        not static (e.g., clusters with dynamic or ephemeral node pools and changing
        hostnames), since unused hosts can otherwise accumulate quickly.
        When disabled (false), host entries remain in the VMS even if unused and must be cleaned
        up manually.
      type: boolean
      default: {{ .Values.blockHostsAutoPrune }}
    hostNamePrefix:
      description: >-
        (Block driver only) Prefix used when naming CSI block hosts (e.g. csi-<node-id>).
        Leave empty to use the default naming scheme.
      type: string
      default: {{ .Values.hostNamePrefix | quote }}
    mountUmountTimeout:
      description: >-
        Timeout in seconds for mount/umount operations.
        If a mount or umount command does not complete within this time, it will be terminated
        and an error will be returned.
      type: integer
      format: int32
      default: {{ .Values.mountUmountTimeout }}
    forceLazyUmountOnTimeout:
      description: When true, a umount that times out is retried with lazy unmount (-l).
      type: boolean
      default: {{ .Values.forceLazyUmountOnTimeout }}
    credSerializationSecret:
      description: |-
        Secret that encrypts EV credentials. Must contain a `key` field.
        Empty: store credentials as plaintext JSON.
        Example: kubectl create secret generic vast-cred-serde --from-literal=key="$(openssl rand -base64 32)"
      type: string
      default: {{ .Values.credSerializationSecret | quote }}
    fallbackToDeser:
      description: |-
        When true, unpublish of already-mounted EV volumes may use legacy AES-CFB+pickle
        metadata and a .vast-csi-meta file on local disk (no tmpfs). New publishes always
        use tmpfs. Leave false (disabled) unless upgrading a cluster that still has
        old-format EV volumes mounted; set false again after they unpublish.
      type: boolean
      default: {{ .Values.fallbackToDeser }}
    resolveMountSymlinks:
      description: >-
        Enable symlink resolution when querying mount information.
        When enabled, mount paths containing symlinks (e.g., /dev/disk/by-uuid/*) will be
        resolved to their canonical paths before comparison.
      type: boolean
      default: {{ .Values.resolveMountSymlinks }}
    allowROManyBlockFsMode:
      description: |-
        (Block driver only) Enable ReadOnlyMany (ROX) access mode for block filesystem volumes.
        When enabled, multiple pods across different nodes can mount the same block volume
        in read-only mode. The device and filesystem will be mounted with the 'ro' flag
        to enforce read-only semantics at the OS level.
      type: boolean
      default: {{ .Values.allowROManyBlockFsMode }}
    disableUsageStats:
      description: >-
        Disable sending usage statistics to VAST cluster.
        When set to true, the CSI driver will not report plugin usage metrics to VMS.
      type: boolean
      default: {{ .Values.disableUsageStats }}
    cacheMaxAgeSeconds:
      description: >-
        Cache-Control max-age header value in seconds for VMS API requests.
        When set to a value greater than 0, the CSI driver will add a Cache-Control header
        to VMS API requests, allowing intermediate caches (like Nginx) to cache responses.
        Set to 0 to disable caching.
      type: integer
      format: int32
      default: {{ .Values.cacheMaxAgeSeconds }}
    applySecurityContextConstraints:
      description: >-
        Flag specifies whether to enforce the defined security context constraints for pods 
        using specified service accounts in OpenShift, essential for ensuring proper permissions for mounting volumes.
      type: boolean
      default: {{ .Values.applySecurityContextConstraints }}
    imagePullSecrets:
      description: Image pull secrets for the CSI driver container image.
      {{- if .GlobalValues.imagePullSecret }}
      default:
        - name: {{ .GlobalValues.imagePullSecret }}
      {{- end }}
      type: array
      items:
        properties:
          name:
            type: string
        type: object
      x-kubernetes-list-type: atomic
    kubeletPath:
      default: {{ .Values.kubeletPath }}
      type: string
      description: Path to kubelet directory
    logLevel:
      default: {{ .Values.logLevel }}
      type: integer
      minimum: 0
      maximum: 5
      description: |-
        The logging level of deployed containers expressed as an integer
        from 0 (low detail) to 5 (high detail). 0 only logs errors. 3 logs most
        RPC requests/responses and some detail about driver actions.


.nfs-driver-dep: &nfs-driver-dep
  'urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:nfs'

.block-driver-dep: &block-driver-dep
  'urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:block'

.replication-enabled-dep: &replication-enabled-dep
  'urn:alm:descriptor:com.tectonic.ui:fieldDependency:replicationEnabled:true'

.use-custom-images-dep: &use-custom-images-dep
  'urn:alm:descriptor:com.tectonic.ui:fieldDependency:image.useCustomRepositories:true'

specDescriptors:
  # Top Level
  - description: Select the type of driver to deploy.
    displayName: Driver Type
    path: driverType
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:select:nfs'
      - 'urn:alm:descriptor:com.tectonic.ui:select:block'
  - description: >-
      Enable VAST asynchronous replication for volumes provisioned by this driver.
      Registers the replication plugin with the cluster VastExtensionsManager.
    displayName: Replication Enabled
    path: replicationEnabled
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
  - description: Whether to verify SSL. This option applies to all sessions across all clusters.
    displayName: verifySsl
    path: verifySsl
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - description: Use this local IP address for mounting, when the StorageClass does not define a vipPool. This is useful for DPU-based deployments.
    displayName: useLocalIpForMount
    path: useLocalIpForMount
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
      - *nfs-driver-dep
  - description: >-
      When the flag is set to 'true', the controller will opt to using a local mount for deleting data from discarded volumes,
      as opposed to sending the request to the VMS over REST.
      Please contact VAST Support before modifying this setting.
    displayName: dontUseTrashApi
    path: dontUseTrashApi
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
      - *nfs-driver-dep
  - description: >-
      Flag specifies whether to enforce the defined security context constraints for pods 
      using specified service accounts in OpenShift, essential for ensuring proper permissions for mounting volumes.
    displayName: applySecurityContextConstraints
    path: applySecurityContextConstraints
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - description: Image pull secrets for the CSI driver container image.
    displayName: Image Pull Secrets
    path: imagePullSecrets
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - description: The number of worker threads the CSI plugin use to serve requests simultaneously.
    displayName: Workers
    path: numWorkers
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - description: Timeout for all Remote Procedure Call (RPC) requests to the CSI driver.
    displayName: Operation Timeout
    path: operationTimeout
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - description: Path to kubelet directory
    displayName: Kubelet Path
    path: kubeletPath
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  # Controller
  - description: Affinity, resource constraints, DNS policy, and other setting for Controller components.
    displayName: Controller runtime configuration settings
    path: controller
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - description: NodeAffinity specifies the nodes where a pod can be scheduled based on node labels.
    displayName: nodeAffinity
    path: controller.nodeAffinity
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:nodeAffinity'
  - description: PodAffinity defines rules for scheduling pods based on the labels of other pods already running on nodes within the Kubernetes cluster.
    displayName: podAffinity
    path: controller.podAffinity
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:podAffinity'
  - description: PodAntiAffinity defines rules for scheduling pods to avoid placing them on nodes where other pods with certain labels are already running within the Kubernetes cluster.
    displayName: podAntiAffinity
    path: controller.podAntiAffinity
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:podAntiAffinity'
  - description: Controller tolerations
    displayName: Tolerations
    path: controller.tolerations
  - description: NodeSelector specifies a map of key-value pairs. For the pod to be eligible to run on a node, the node must have each of the indicated key-value pairs as labels.
    displayName: nodeSelector
    path: controller.nodeSelector
  - description: Controller dnsPolicy
    displayName: dnsPolicy
    path: controller.dnsPolicy
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:select:Default'
