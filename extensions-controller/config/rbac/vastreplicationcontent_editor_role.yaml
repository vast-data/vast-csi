# This rule is not used by the project extensions-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the vastdata.vastdata.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: extensions-controller
    app.kubernetes.io/managed-by: kustomize
  name: vastreplicationcontent-editor-role
rules:
- apiGroups:
  - vastdata.vastdata.com
  resources:
  - vastreplicationcontents
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - vastdata.vastdata.com
  resources:
  - vastreplicationcontents/status
  verbs:
  - get
