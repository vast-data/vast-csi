# COSI S3 lifecycle rules on BucketClass (VCSI-327).
# Wire key lifecycle_rules is a JSON string (Helm uses lifecycleRules list → same JSON).
# Rules apply at bucket create; removed on bucket delete. BucketClass is immutable.
#
# Prerequisites: VAST S3 lifecycle API available on the cluster.
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClass
metadata:
  name: vastdata-lc-rules
driverName: csi.vastdata.com
deletionPolicy: Delete
parameters:
  root_export: /cosi
  vip_pool_name: vippool-1
  view_policy: s3_default_policy
  scheme: http
  lifecycle_rules: |
    [
      {
        "name": "expire-logs",
        "expiration_days": 30,
        "prefix": "logs/"
      },
      {
        "name": "expire-tmp",
        "expiration_days": 7,
        "prefix": "tmp/",
        "abort_mpu_days_after_initiation": 1
      }
    ]

---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: sample-lc-bucket
spec:
  bucketClassName: vastdata-lc-rules
  protocols:
  - s3
