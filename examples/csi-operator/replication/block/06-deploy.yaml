apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-block
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp-block
  template:
    metadata:
      labels:
        app: myapp-block
    spec:
      # Uncomment when using a private registry for the CSI images:
      # imagePullSecrets:
      #   - name: regcred
      containers:
        - name: app
          image: busybox
          command:
            - sh
            - -c
            - while true; do echo "$(date) site=primary-block-sc" >> /data/log.txt; sleep 5; done
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: block-myapp-data-1
