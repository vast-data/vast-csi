apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: csi-pvc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: vastdata-filesystem
---
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: csi-vast-test-app
spec:
  serviceName: "csi-vast"
  replicas: 5
  selector:
    matchLabels:
      app: csi-vast-test-app
  template:
    metadata:
      labels:
        app: csi-vast-test-app
        role: csi-vast-app
    spec:
      containers:
        - name: my-frontend
          image: busybox
          volumeMounts:
          - mountPath: "/shared"
            name: my-shared-volume
          command: [ "sleep", "1000000" ]
      volumes:
        - name: my-shared-volume
          persistentVolumeClaim:
            claimName: csi-pvc
