{{/* Vast CSI Node */}}

{{- $csi_images := .Values.image -}}
{{- $kubelet_path := .Values.kubeletPath | default "/var/lib/kubelet" | trimSuffix "/" }}
{{- $driver_name := include "vast.common.csi.driverName" . -}}
{{- $csi_sock := printf "%s.sock" ($driver_name | lower | replace "." "-" | replace "_" "-" | trimSuffix "-" | trimPrefix "-") -}}

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: csi-vast-node
  namespace: {{ include "vast.common.namespace" . }}
  labels:
{{- include "vast.common.labels" . | nindent 4 }}
    app.kubernetes.io/csi-role: "node"
spec:
  selector:
    matchLabels:
      app: "csi-vast-node"
{{- include "vast.common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: csi-vast-node
        role: csi-vast
{{- include "vast.common.labels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
{{- include "vast.common.imagePullSecrets" (dict "secrets" .Values.imagePullSecrets) | nindent 6 }}
      affinity:
        podAffinity:
          {{- toYaml .Values.node.podAffinity | nindent 10 }}
        podAntiAffinity:
          {{- toYaml .Values.node.podAntiAffinity | nindent 10 }}
        nodeAffinity:
          {{- toYaml .Values.node.nodeAffinity | nindent 10 }}
      containers:
{{- if .Values.node.nfsServices.enabled }}
        - name: csi-nfs-services
          image: {{ include "vast.common.image" (dict "root" $ "image" $csi_images.csiVastPlugin) }}
          imagePullPolicy: {{ $csi_images.csiVastPlugin.imagePullPolicy | default "IfNotPresent" }}
          args:
            - run-nfs-services
            - --services={{ join "," .Values.node.nfsServices.services }}
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
{{- if or (has "idmapd" .Values.node.nfsServices.services) (has "tlshd" .Values.node.nfsServices.services) }}
          volumeMounts:
{{- if has "idmapd" .Values.node.nfsServices.services }}
            - name: nfs-state
              mountPath: /var/lib/nfs
              mountPropagation: HostToContainer
            - name: idmapd-conf
              mountPath: /etc/idmapd.conf
              readOnly: true
{{- end }}
{{- if has "tlshd" .Values.node.nfsServices.services }}
            - name: tlshd-conf
              mountPath: /etc/tlshd.conf
              readOnly: true
{{- end }}
{{- end }}
          resources: {{- toYaml .Values.node.resources.nfsServices | nindent 12 }}
{{- end }}
        - name: csi-node-driver-registrar
          image: {{ include "vast.common.image" (dict "root" $ "image" $csi_images.csiNodeDriverRegistrar) }}
          args:
{{- include "vast.common.csi.args" . | nindent 12 }}
            - "--kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)"
          imagePullPolicy: {{ $csi_images.csiNodeDriverRegistrar.imagePullPolicy | default  "IfNotPresent" }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "rm -rf /registration/{{ $driver_name }} /registration/{{ $driver_name }}-reg.sock"]
          env:
            - name: ADDRESS
              value: /csi/{{ $csi_sock }}
            - name: DRIVER_REG_SOCK_PATH
              value: {{ $kubelet_path }}/plugins/{{ $driver_name }}/{{ $csi_sock }}
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi/
            - name: registration-dir
              mountPath: /registration/
          resources: {{- toYaml .Values.node.resources.nodeDriverRegistrar | nindent 12 }}
        - name: csi-vast-plugin
          image: {{ include "vast.common.image" (dict "root" $ "image" $csi_images.csiVastPlugin) }}
          args:
            - "serve"
            - "--plugin=nfs"
          imagePullPolicy: {{ $csi_images.csiVastPlugin.imagePullPolicy | default  "IfNotPresent" }}
          env:
{{- include "vastcsi.commonEnv" . | indent 12 }}
            - name: CSI_ENDPOINT
              value: unix:///csi/{{ $csi_sock }}
            - name: X_CSI_MODE
              value: node
            - name: X_CSI_NODE_ID
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: X_CSI_METRICS_ENABLED
              value: "{{ .Values.node.metrics.enabled }}"
            - name: X_CSI_METRICS_PORT
              value: "{{ .Values.node.metrics.port }}"
{{- if .Values.node.nfsServices.enabled }}
            - name: X_CSI_NFS_SERVICES_WAIT
              value: "{{ join "," .Values.node.nfsServices.services }}"
{{- end }}
{{- if .Values.node.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.node.metrics.port }}
              protocol: TCP
{{- end }}
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: {{ $kubelet_path }}
              mountPropagation: "Bidirectional"
            - name: device-dir
              mountPath: /dev
          {{- if .Values.node.metrics.enabled }}
            - name: host
              mountPath: /host
              mountPropagation: "Bidirectional"
          {{- end }}
          {{- if .Values.node.propagateHostMountOptions }}
            - name: host-nfsmount-conf-d
              mountPath: /etc/nfsmount.conf.d
          {{- end }}
{{- include "vast.common.vmsAuth.volumeMounts" . | indent 12 }}
{{- include "vast.common.credSerde.volumeMount" . | indent 12 }}
          resources: {{- toYaml .Values.node.resources.csiVastPlugin | nindent 12 }}
      hostNetwork: true
      hostPID: true  # Required for NFS mTLS: access host's kernel keyring namespace
      dnsPolicy: {{ .Values.node.dnsPolicy }}
      nodeSelector:
{{ toYaml .Values.node.nodeSelector | indent 8 }}
      priorityClassName: {{ .Values.node.priorityClassName }}
      serviceAccountName: {{ .Release.Name }}-vast-node-sa
      tolerations:
{{ toYaml .Values.node.tolerations | indent 8 }}
      volumes:
        - name: registration-dir
          hostPath:
            path: {{ $kubelet_path }}/plugins_registry/
            type: DirectoryOrCreate
        - name: plugin-dir
          hostPath:
            path: {{ $kubelet_path }}/plugins/{{ $driver_name }}
            type: DirectoryOrCreate
        - name: pods-mount-dir
          hostPath:
            path: {{ $kubelet_path }}
            type: Directory
        - name: device-dir
          hostPath:
            path: /dev
      {{- if has "idmapd" .Values.node.nfsServices.services }}
        - name: nfs-state
          hostPath:
            path: /var/lib/nfs
            type: DirectoryOrCreate
        - name: idmapd-conf
          hostPath:
            path: /etc/idmapd.conf
            type: File
      {{- end }}
      {{- if has "tlshd" .Values.node.nfsServices.services }}
        - name: tlshd-conf
          hostPath:
            path: /etc/tlshd.conf
            type: File
      {{- end }}
      {{- if .Values.node.metrics.enabled }}
        - name: host
          hostPath:
            path: /
            type: Directory
      {{- end }}
{{- include "vast.common.vmsAuth.volumes" . | indent 8 }}
{{- include "vast.common.credSerde.volume" . | indent 8 }}
       {{- if .Values.node.propagateHostMountOptions }}
        - hostPath:
            path: /etc/nfsmount.conf.d
            type: DirectoryOrCreate
          name: host-nfsmount-conf-d
        {{- end }}
