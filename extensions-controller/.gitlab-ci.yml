build_extension_controller:
  stage: build
  script: |
    set -x
    VERSION=$(cat version.txt)
    export IMAGE_TAG=${IMAGE_NAME}-extensions
    export DOCKERFILE=extensions-controller/Dockerfile
    export GIT_TAG=${VERSION}
    export PUSH_ON_SUCCESS=true
    make build_image
    echo "pushed ${IMAGE_TAG}"
  tags:
    - vast-dev-builder

# Publish Extensions Manager image for Red Hat certification.
#
# Prerequisites (one-time):
#   1. connect.redhat.com component "VAST CSI Extensions Manager" (PID 6a7749d0e2de992babce2093)
#   2. Repository Information filled in (namespace vastdataorg, outbound repo csi-extensions)
#   3. PYXIS_API_TOKEN in GitLab (shared with driver/operator; Product management → Container API keys)
#
# Registry login reuses CSI_DRIVER_REGISTRY_KEY (or CSI_OPERATOR_REGISTRY_KEY) — Red Hat issues one
# org-wide registry key; each component only differs by robot username (redhat-isv-containers+<PID>-robot).
#
# Local dry-run before CI:
#   ./extensions-controller/scripts/verify-redhat-image.sh
#
# Note: Images are published to catalog automatically only if "Auto-publish" is enabled in the catalog listing.
publish_extensions_image_redhat:
  stage: redhat
  script: |
    set -x
    REGISTRY_KEY="${CSI_DRIVER_REGISTRY_KEY:-${CSI_OPERATOR_REGISTRY_KEY}}"
    if [ -z "${REGISTRY_KEY}" ]; then
      echo "Error: set CSI_DRIVER_REGISTRY_KEY (or CSI_OPERATOR_REGISTRY_KEY) in GitLab CI/CD variables"
      exit 1
    fi
    if [ -z "${PYXIS_API_TOKEN}" ]; then
      echo "Error: set PYXIS_API_TOKEN in GitLab CI/CD variables"
      exit 1
    fi

    docker login -u ${RH_DOCKER_USER} -p ${RH_DOCKER_PASSWORD} registry.redhat.io
    export VERSION=$(cat version.txt)
    export VERSION=${VERSION#v}  # Remove the 'v' prefix for the Red Hat image tag

    export PROJECT_ID=6a7749d0e2de992babce2093
    echo "${REGISTRY_KEY}" | docker login -u "redhat-isv-containers+${PROJECT_ID}-robot" --password-stdin quay.io
    export IMAGE_TAG="quay.io/redhat-isv-containers/${PROJECT_ID}:${VERSION}"
    export DOCKERFILE=extensions-controller/Dockerfile
    export PUSH_ON_SUCCESS=true
    make build_image
    make run_preflight
    echo "Published and submitted for certification: ${IMAGE_TAG}"
  when: manual
  tags:
    - vast-dev-builder

build_vastcsi_cli:
  stage: build
  script: |
    set -x
    cd extensions-controller

    go fmt ./cmd/... ./internal/... ./api/...
    go vet ./cmd/... ./internal/... ./api/...

    GIT_COMMIT=$(git rev-parse --short=8 HEAD)
    GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev")
    GO_PROJECT=github.com/vast-data/vast-csi/extensions-controller
    LDFLAGS="-s -w \
      -X ${GO_PROJECT}/internal/common/version.GitCommit=${GIT_COMMIT} \
      -X ${GO_PROJECT}/internal/common/version.Version=${GIT_TAG}"

    mkdir -p artifacts
    PLATFORMS="linux/amd64 darwin/amd64 windows/amd64"

    for PLATFORM in $PLATFORMS; do
      OS=$(echo $PLATFORM | cut -d/ -f1)
      ARCH=$(echo $PLATFORM | cut -d/ -f2)
      EXT=""
      if [ "$OS" = "windows" ]; then
        EXT=".exe"
      fi

      OUT_DIR="artifacts/${OS}_${ARCH}"
      BIN_NAME="vcsi${EXT}"

      mkdir -p "$OUT_DIR"
      echo "Building CLI for $OS/$ARCH"
      CGO_ENABLED=0 GOOS=$OS GOARCH=$ARCH go build \
        -ldflags "${LDFLAGS}" \
        -a -o "${OUT_DIR}/${BIN_NAME}" cmd/main.go

      tar -czf "artifacts/vcsi_${OS}_${ARCH}.tar.gz" -C "$OUT_DIR" "$BIN_NAME"
    done
  artifacts:
    name: "vcsi-cli-$CI_PIPELINE_ID"
    paths:
      - extensions-controller/artifacts/
    expire_in: 5 days
  tags:
    - vast-dev-builder
