# NFS PVCs on the primary StorageClass (RWO).
# The extension controller groups PVCs for VolumeGroupReplication.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-myapp-data-1
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: vastdata-filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-myapp-data-2
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: vastdata-filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-myapp-data-3
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: vastdata-filesystem
