{{/* ClusterRoleBindings for Vast CSI */}}

{{- $namespace := include "vast.common.namespace" . }}
{{- $releaseName := .Release.Name }}

{{- $bindings := (list "provisioner" "attacher" "resizer") }}

{{- range $index, $role := $bindings }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $releaseName }}-vast-{{ $role }}-binding
  labels:
{{- include "vast.common.labels" $ | nindent 4 }}
    storage.vastdata.com/driverType: {{ $.Values.driverType }}
subjects:
  - kind: ServiceAccount
    name: {{ $releaseName }}-vast-controller-sa
    namespace: {{ $namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $releaseName }}-vast-{{ $role }}-role
  apiGroup: rbac.authorization.k8s.io

---
{{ end }}
{{- if .Values.replicationEnabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $releaseName }}-csi-addons-binding
  labels:
{{- include "vast.common.labels" . | nindent 4 }}
    storage.vastdata.com/driverType: {{ .Values.driverType }}
subjects:
  - kind: ServiceAccount
    name: {{ $releaseName }}-vast-controller-sa
    namespace: {{ $namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $releaseName }}-csi-addons-role
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
