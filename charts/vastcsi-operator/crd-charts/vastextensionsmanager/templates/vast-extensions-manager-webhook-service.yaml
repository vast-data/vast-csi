{{- $wh := .Values.webhook -}}
{{- $ns := include "vast.common.namespace" . | trimAll "\"" }}
{{- $svcName := include "vastextensionsmanager.webhookServiceName" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  namespace: {{ $ns }}
  labels:
{{- include "vast.common.labels" . | nindent 4 }}
    app.kubernetes.io/component: vast-extensions-manager
spec:
  publishNotReadyAddresses: true
  ports:
    - port: 443
      targetPort: {{ $wh.port | default 9443 }}
      name: webhook
  selector:
    app: {{ include "vastextensionsmanager.deploymentName" . }}
