{{- if and .Values.node.metrics.enabled .Values.node.metrics.serviceMonitor.enabled }}
{{/*
  ServiceMonitor (Prometheus Operator CRD): tells Prometheus to scrape this Service's /metrics.
  Only has effect when Prometheus Operator is installed. See:
  https://prometheus-operator.dev/docs/getting-started/introduction/
*/}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-vast-node-metrics
  namespace: {{ include "vastcsi.namespace" . }}
  labels:
{{- include "vastcsi.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
    app.kubernetes.io/csi-role: "node"
{{- with .Values.node.metrics.serviceMonitor.labels }}
{{- toYaml . | nindent 4 }}
{{- end }}
spec:
  selector:
    matchLabels:
{{- include "vastcsi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
      app.kubernetes.io/csi-role: "node"
  namespaceSelector:
    matchNames:
      - {{ include "vastcsi.namespace" . }}
  endpoints:
    - port: metrics
      interval: {{ .Values.node.metrics.serviceMonitor.interval }}
      path: /metrics
      scheme: http
{{- if .Values.node.metrics.serviceMonitor.relabelings }}
      relabelings:
{{- toYaml .Values.node.metrics.serviceMonitor.relabelings | nindent 8 }}
{{- end }}
{{- if .Values.node.metrics.serviceMonitor.metricRelabelings }}
      metricRelabelings:
{{- toYaml .Values.node.metrics.serviceMonitor.metricRelabelings | nindent 8 }}
{{- end }}
{{- end }}
