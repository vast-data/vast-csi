####################
# VAST REST SESSION ATTRIBUTES
####################
# Secret name, which corresponds to a secret containing credentials to login - should be provided by user if secretName is not provided in StorageClass attributes
# Secret must contain username,password and endpoint fields
# This is global secret for all storage classes.
# You can specify either global secret or secret per storage class (see `storageClassDefaults.secretName).
# Example:
#     kubectl create secret generic vast-mgmt
#    --from-literal=username='<VAST username>' \
#    --from-literal=password='<VAST password>' \
#    --from-literal=endpoint='<VAST endpoint>'
#
# Optionally, you can include:
# - ssl_cert: SSL certificate for secure communication
# - tenant: The tenant name for tenant scoped authentication (tenant admin).
secretName: ""

# Set true to enable certificate validity test
verifySsl: false

# Path (absolute or relative) to SSL certificate for verifying the VAST REST API.
# Must be set using `set-file` option eg `--set-file sslCert=< path to sslCert.crt >`
# sslCertsSecretName secret and sslCert option in values.yaml are mutually exclusive. Make sure to use only one of them.
sslCert: ""
# Secret name, which corresponds to a secret containing an SSL certificate for verifying the VAST REST API
# Example: kubectl create secret generic vast-tls --from-file=ca-bundle.crt=< path to sslCert.crt >
# sslCertsSecretName secret and sslCert option in values.yaml are mutually exclusive. Make sure to use only one of them.
sslCertsSecretName: ""
# If set to true, the CSI driver will automatically prune (delete) VAST Host
# entries (NQNs) when they are no longer in use by any PVCs on the corresponding
# Kubernetes node. This prevents "host sprawl" from unused auto-generated NQNs.
#
# This option is particularly useful in Kubernetes environments where nodes are
# not static (e.g., clusters with dynamic or ephemeral node pools and changing
# hostnames), since unused hosts can otherwise accumulate quickly.
#
# When disabled (false), hosts remain in VAST even if unused and must be cleaned
# up manually.
blockHostsAutoPrune: false
# Prefix used when naming CSI block hosts (e.g. csi-<node-id>)
hostNamePrefix: ""
# Timeout in seconds for mount/umount operations.
# If a mount or umount command does not complete within this time, it will be terminated
# and an error will be returned. This prevents the driver from getting stuck indefinitely
# due to network issues or unresponsive storage.
mountUmountTimeout: 30
# Enable symlink resolution when querying mount information.
# When enabled, mount paths containing symlinks (e.g., /dev/disk/by-uuid/*) will be
# resolved to their canonical paths before comparison.
# Default: false (skip symlink resolution for maximum performance)
resolveMountSymlinks: false
# Enable ReadOnlyMany (ROX) access mode for block filesystem volumes.
# When enabled, multiple pods across different nodes can mount the same block volume
# in read-only mode. The device and filesystem will be mounted with the 'ro' flag
# to enforce read-only semantics at the OS level.
# Default: false (ROX is disabled for block filesystem volumes)
allowROManyBlockFsMode: false

####################
# VAST CSI STORAGE CLASS OPTIONS
####################
# storageClassDefaults is set of options that will be using by default if option is not provided
# for particular storageClass in 'storageClasses' section
storageClassDefaults:
  # Any of the following options can be specified within the StorageClasses section on a per-storage class basis,
  # or can be set here as default values for all storage classes.

  # Secret name, which corresponds to a secret containing credentials to login - must be provided by user
  # The secret must contain authentication fields for VAST login, including the endpoint field.
  # For username/password authentication, the secret must include:
  # - username: VAST username
  # - password: VAST password
  # - endpoint: VAST API endpoint
  # Example:
  #     kubectl create secret generic vast-mgmt \
  #       --from-literal=username=< VAST username > \
  #       --from-literal=password=< VAST password > \
  #       --from-literal=endpoint=< VAST endpoint >
  #
  # For API token authentication, the secret must include:
  # - token: API token
  # - endpoint: VAST API endpoint
  # Example:
  #     kubectl create secret generic vast-mgmt \
  #       --from-literal=token=< API token > \
  #       --from-literal=endpoint=< VAST endpoint >
  #
  # Optionally, you can include:
  # - ssl_cert: SSL certificate for secure communication
  # - tenant: The tenant name for tenant scoped authentication (tenant admin).
  # All other fields are ignored.
  secretName: ""
  # Secret namespace. If not specified then secret will be searched in the same namespace as StorageClass is created.
  secretNamespace: ""
  # Subsystem name - must be provided by user
  subsystem: ""
  # Tenant name – required for additional filtering when multiple subsystems share the same name.
  tenantName: ""
  # Optional template for constructing the volume group name.
  # It supports placeholders for the PVC name, namespace, and ID,
  # which can be used in the format {namespace}, {name}, and {id}.
  # If not provided, a default template will be used. The volume group
  # can represent nested folder structures. For example:
  #   - "folder1/folder2/block-{namespace}-{id}
  volumeGroup: ""
  # Enables encryption using LUKS on the device on the client side.
  # If set to true, the CSI driver will expect a passphrase to be provided
  # with the vast-mgmt secret.

  # Example Kubernetes Secret for host encryption:
  # kubectl create secret generic vast-mgmt --from-literal=username='' --from-literal=password='' --from-literal=endpoint='' --from-literal=passphrase=''

  # Ensure the StorageClass has the following parameters set when host Encryption is true:
  # Optional host encryption parameters (will default if not specified):
  #   cipher: "aes-xts-plain64"           # Encryption cipher
  #   key_size: "512"                     # Key size in bits (e.g., 256 or 512)
  #   hash: "sha256"                      # Hashing algorithm
  #   pbkdf_memory: "65536"               # Memory cost for PBKDF in KB
  #
  # Optional LUKS performance flags for cryptsetup open (defaults are enabled):
  #   perf-same_cpu_crypt: true            # Use same CPU for encryption work (set to false to disable)
  #   perf-submit_from_crypt_cpus: true    # Submit IO from crypt CPUs (set to false to disable)
  #   perf-no_read_workqueue: true         # Bypass read workqueue (set to false to disable)
  #   perf-no_write_workqueue: true        # Bypass write workqueue (set to false to disable)
  #
  # Disable read/write workqueues while keeping other perf flags on:
  #   hostEncryption:
  #     perf-no_read_workqueue: false
  #     perf-no_write_workqueue: false
  #
  # Fully explicit configuration with defaults shown (override as needed):
  #   hostEncryption:
  #     cipher: "aes-xts-plain64"
  #     key_size: "512"
  #     hash: "sha256"
  #     pbkdf_memory: "65536"
  #     perf-same_cpu_crypt: true
  #     perf-submit_from_crypt_cpus: true
  #     perf-no_read_workqueue: true
  #     perf-no_write_workqueue: true
  hostEncryption: {}
  # Name of VAST VIP pool to use. Must specify either vipPool or vipPoolFQDN.
  vipPool: ""
  # The FQDN of the VIP pool to use. Must specify either vipPool or vipPoolFQDN.
  # Using a DNS skips an API call to the VMS for obtaining a random VIP from the vipPool, leading to faster volume mounting.
  # NOTE: The driver will prepend the FQDN with a random prefix, which forces the NFS client to resolve into a different VIP,
  # thereby distributing the load across the entire range of the VIP pool.
  vipPoolFQDN: ""
  # vipPoolFQDNRandomPrefix helps distribute load across the entire VIP pool by randomizing the VIP resolved for each volume mount.
  # If set to true, a random prefix will be added to the VIP FQDN, ensuring that each NFS mount request resolves to a different VIP from the VIP pool.
  vipPoolFQDNRandomPrefix: true
  # Allows resizing existing volumes
  allowVolumeExpansion: true
  # If true, sets Vast CSI as the cluster-wide storage class default
  setDefaultStorageClass: false
  # Add any extra mount NFS options here
  mountOptions: []
  # Name of QoS policy associates with the volume.
  qosPolicy: ""
  # Reclaim policy to use with the storage class.
  reclaimPolicy: "Delete"
  # Filesystem type to format the volume during creation.
  # Allowed values:
  #   - ext4: Ext4 filesystem
  #   - xfs: XFS filesystem
  fsType: ""
  # Host connectivity type used for block storage.
  # Allowed values:
  #   - TCP
  #   - RDMA
  # Default: TCP
  transportType: "TCP"
  # If true, the CSI driver will wait for the GSS (global snapshot stream) process to fully complete
  # before returning from a volume clone operation.
  # This ensures the volume is fully usable and consistent at the time of provisioning, but may add
  # significant latency if the underlying GSS operation is long-running.
  #
  # If false (default), the driver returns as soon as the clone operation is initiated, allowing
  # Kubernetes to proceed while the data stream continues in the background.
  blockingClones: false

# Default storage class to use with CSI DRIVER.
# The only required value is 'vipPool' name where user should provide name of existing vip pool on
# VAST cluster.
# User can extend this section using more storage classes with different storage class parameters and options.
storageClasses: {}
  # StorageClass name. This field must be unique across all storage classes.
  # vastdata-block:
    # Name of VAST VIP pool to use - must be provided by user
    # vipPool: ""
    # ... Any other options from 'storageClassDefaults' section. If not provided then default value
    # will be used.
# User can add more storage classes to this section eg:
#  vastdata-block2:
#    subsystem: "subsystem2"
#    vipPool: "vippool-2"
#    secretName: "secret2"
#    .... other options
#
#  vastdata-block3:
#    subsystem: "subsystem3"
#    vipPool: "vippool-3"
#    secretName: "secret3"
#    ....  other options

####################
# EXTENSION CONTROLLER
####################
# The extensions controller is a companion component to the CSI driver that provides
# additional extended capabilities beyond the core CSI driver functionality.
# It runs as a separate deployment alongside the CSI driver.
#
# Features (each can be independently enabled):
# - PVC Label Injection Webhook: Automatically injects replication-related labels onto
#   PVCs at creation time based on StorageClass parameters.
# - Remote PVC Controller: Creates PVCs on destination cluster based on source PVCs
# - VolumeReplication CRD Controller: Optionally creates VolumeReplication CRDs
# - Pod Failover Controller: Terminates pods with source mounts, waits for replication
#   switchover, and restarts pods with destination PVCs (not yet implemented).
extensions:
  # Master flag to enable/disable all extension features at once (webhooks, replication, etc.)
  enabled: false
  # devLogging enables human-readable console logging (colored levels, caller, ISO-8601 timestamps)
  devLogging: true
  
  # PVC Label Injection Webhook
  # Admission webhooks served by the extension controller.
  # All webhook handlers share one HTTPS server (same port and TLS certificate).
  webhook:
    # Port for the webhook HTTPS server.
    port: 9443

    # Set to true to disable the PVC label injection webhook.
    # When false (default), labels (storageClass, subsystem, volumeGroup) are
    # automatically injected onto PVCs at creation time based on StorageClass parameters.
    # Note: replication CRD validation webhooks (VSCR/VVR) are always active
    # whenever extensions.enabled is true.
    disablePvcLabelsWebhook: false

    # Failure policy applied to all webhook handlers.
    # - Fail:   the operation is rejected when the webhook is unreachable or times out.
    # - Ignore: the operation is allowed through (useful during cluster outages).
    failurePolicy: Fail

    # Admission deadline (seconds) passed to the API server for all webhooks.
    timeoutSeconds: 30

    # TLS certificate configuration.
    # When certManager.enabled is false a self-signed CA+cert is generated by Helm
    # and stored in a Secret (simple, but will not auto-renew).
    # When certManager.enabled is true, cert-manager issues and rotates the cert.
    certManager:
      enabled: false
      # cert-manager Issuer or ClusterIssuer reference
      # issuerRef:
      #   name: letsencrypt-prod
      #   kind: ClusterIssuer

    # PVC filtering for the label injection webhook.
    # By default only PVCs whose StorageClass provisioner matches csiDriverName are
    # processed (see csiDriverName below, which defaults to .Values.csiDriverName).
    # Use the additional options below to further restrict scope.
    filterConfig:
      # storageClassName and storageClassNameRegex are mutually exclusive.
      # If set, only PVCs using this exact StorageClass name get labels injected.
      storageClassName: ""
      # If set, only PVCs whose StorageClass name matches this regex get labels.
      # Example: "^vastdata-.*"
      storageClassNameRegex: ""
      # If set, only PVCs whose name matches this regex get labels.
      # Example: "^repl-.*"
      pvcNameRegex: ""
      # Only inject labels into PVCs whose StorageClass provisioner matches this
      # CSI driver name.  Supports Helm template strings.
      # Set to "" to process PVCs from any provisioner.
      csiDriverName: '{{ .Values.csiDriverName }}'

  # Each StorageClass represents a different VAST cluster (identified by credentials).
  replication:
    # Format string for destination PVC names. Available tokens:
    #   {pvc_name}            - full source PVC name
    #   {pvc_name_suf:<N>}    - last N characters of source PVC name
    #   {pvc_name_pref:<N>}   - first N characters of source PVC name
    #   {endpoint}            - VAST endpoint (slugified)
    #   {sc_name}             - destination StorageClass name
    #   {sc_name_suf:<N>}     - last N characters of StorageClass name
    #   {sc_name_pref:<N>}    - first N characters of StorageClass name
    pvcNameFormat: "{pvc_name}-repl-{endpoint}"
    # Format string for destination PV names. Available tokens:
    #   {pv_name}             - full source PV name
    #   {pv_name_suf:<N>}     - last N characters of source PV name
    #   {pv_name_pref:<N>}    - first N characters of source PV name
    #   {endpoint}            - VAST endpoint (slugified)
    #   {sc_name}             - destination StorageClass name
    #   {sc_name_suf:<N>}     - last N characters of StorageClass name
    #   {sc_name_pref:<N>}    - first N characters of StorageClass name
    pvNameFormat: "{pv_name}-repl-{endpoint}"

  # Scheduling and resource configuration for the replication controller deployment.
  # runOnMaster flag indicated if replication controller should be run on master.
  runOnMaster: false
  # runOnControlPlane flag indicated if replication controller should be run on control plane node.
  runOnControlPlane: false
  # determine how DNS (Domain Name System) resolution should be handled within Pod.
  dnsPolicy: Default
  # nodeSelector for the replication controller pod
  nodeSelector: {}
  # tolerations for the replication controller pod
  tolerations: []
  # Allows to specify which nodes your pod is eligible to be scheduled based on labels on pods that are already running on the node.
  podAffinity: {}
  # Allows to specify conditions for preventing pods from being scheduled on nodes where certain labels are already present on other pods.
  podAntiAffinity: {}
  # Allows to specify which nodes your pod is eligible to be scheduled on based on labels on the node.
  nodeAffinity: {}
  # Resources for the replication controller container
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  # priorityClassName for the replication controller pod
  priorityClassName: system-cluster-critical

####################
# EXTENSION CONTROLLER OPTIONS
####################

extensionController:
  # runOnMaster flag indicated if Extension Controller should be run on master.
  runOnMaster: false
  # runOnControlPlane flag indicated if Extension Controller should be run on control plane node.
  runOnControlPlane: false
  # determine how DNS (Domain Name System) resolution should be handled within Pod.
  dnsPolicy: Default
  # nodeSelector for the extension controller pod
  nodeSelector: {}
  # tolerations for the extension controller pod
  tolerations: []
  # Allows to specify which nodes your pod is eligible to be scheduled based on labels on pods that are already running on the node.
  # https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  podAffinity: {}
  # Allows to specify conditions for preventing pods from being scheduled on nodes where certain labels are already present on other pods.
  # https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  podAntiAffinity: {}
  # Allows to specify which nodes your pod is eligible to be scheduled on based on labels on the node
  # https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  nodeAffinity: {}
  # Resources for the extension controller containers
  resources:
    csiVastPlugin:
      limits:
        memory: 500Mi
      requests:
        cpu: 100m
        memory: 50Mi
    csiAddonsSidecar:
      limits:
        memory: 200Mi
      requests:
        cpu: 10m
        memory: 20Mi
  # priorityClassName for the extension controller pod
  priorityClassName: system-cluster-critical

####################
# VAST PROVISIONER RUNTIME PARAMETERS
####################

# The number of worker threads the CSI plugin use to serve requests simultaneously.
numWorkers: 10
# Timeout of all calls to CSI driver.
operationTimeout: 60
# Timeout for CSI-Addons operations (in seconds). This applies to replication and other CSI-Addons services.
addonsOperationTimeout: 120
# Disable sending usage statistics to VAST cluster.
# When set to true, the CSI driver will not report plugin usage metrics to VMS.
disableUsageStats: false
# Cache-Control max-age header value in seconds for VMS API requests.
# When set to a value greater than 0, the CSI driver will add a Cache-Control header
# to VMS API requests, allowing intermediate caches (like Nginx) to cache responses.
# This is useful for handling burst traffic patterns and reducing load on the VMS.
# Set to 0 to disable caching (default).
cacheMaxAgeSeconds: 0
# Each time a failure occurs, sidecar containers initiate retries
# but only after waiting for 'operationRetryIntervalStart' seconds
# which then doubles with each subsequent failure  until it reaches `operationRetryIntervalMax`
operationRetryIntervalStart: 10

# Maximum interval between attempts.
operationRetryIntervalMax: 60

# indicates this CSI driver requires an attach operation as it implements the `ControllerPublishVolume`
# if set to false, the driver will perform `ControllerPublishVolume` as a part of NodePublishVolume op
# which might speed up the volume attach operation significantly but not appropriate for workload nodes where
# http/https ports are not open.
attachRequired: true

# The name of the CSI driver registered with Kubernetes.
# This value is used to identify the driver in CSI objects like VolumeAttachments and CSINodes.
csiDriverName: block.csi.vastdata.com

####################
# VAST CSI SNAPSHOTS CLASS OPTIONS
####################
# snapshotClassDefaults is set of options that will be using by default if option is not provided
# for particular snapshotClass in 'snapshotClasses' section
snapshotClassDefaults:
  # Any of the following options can be specified within the snapshotClasses section on a per-snapshot class basis,
  # or can be set here as default values for all snapshot classes.

  # Secret name, which corresponds to a secret containing credentials to login - must be provided by user
  # Secret must contain username, password and endpoint fields. Other fields are ignored.
  # Example: kubectl create secret generic vast-mgmt --from-literal=username='< VAST username >' --from-literal=password='< VAST password >' --from-literal=endpoint='< VAST endpoint >'
  # Optionally you can include CA ssl certificate. Along with verifySsl option enabled it will establish trusted connection per SnapshotClass
  # if you have different certificates per cluster (Otherwise use `sslCertsSecretName` to specify global secret with ssl certificate to be used across all snapshot classes):
  # Example:
  #     kubectl create secret generic vast-mgmt \
  #    --from-literal=username='<VAST username>' \
  #    --from-literal=password='<VAST password>' \
  #    --from-literal=endpoint='<VAST endpoint>' \
  #    --from-file=ssl_cert='<path to sslCert.crt>'
  secretName: ""
  # Secret namespace. If not specified then secret will be searched in the same namespace as SnapshotClass is created.
  secretNamespace: ""
  # If true, sets SnapshotClass as the cluster-wide snapshot class default
  setDefaultSnapshotClass: true
  # String template for CSI-provisioned snapshot names, within VAST
  snapshotNameFormat: "csi:{id}:{namespace}:{name}"
  # On snapshot delete behavior. By default, Vast Cluster snapshot will be removed as well.
  deletionPolicy: "Delete"

snapshotClasses: {}
#  vastdata-snapshot:
#    secretName: "secret"
#    deletionPolicy: "Delete"
#    setDefaultSnapshotClass: false
#    snapshotNameFormat: "snapshot:{name}:{id}"

####################
# VAST CONTROLLER AND NODE IMAGE SPECIFICATION
####################

image:
  csiVastPlugin:
    repository: vastdataorg/csi
    tag: v2.6.6-beta-2391868  # the version of the Vast CSI driver
    imagePullPolicy: IfNotPresent
  csiAttacher:
    repository: registry.k8s.io/sig-storage/csi-attacher
    tag: v4.5.0
    imagePullPolicy: IfNotPresent
  csiNodeDriverRegistrar:
    repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: v2.10.0
    imagePullPolicy: IfNotPresent
  csiProvisioner:
    repository: registry.k8s.io/sig-storage/csi-provisioner
    tag: v4.0.0
    imagePullPolicy: IfNotPresent
  csiResizer:
    repository: registry.k8s.io/sig-storage/csi-resizer
    tag: v1.10.0
    imagePullPolicy: IfNotPresent
  csiSnapshotter:
    repository: registry.k8s.io/sig-storage/csi-snapshotter
    tag: v7.0.1
    imagePullPolicy: IfNotPresent
  csiAddonsSidecar:
    repository: quay.io/csiaddons/k8s-sidecar
    tag: v0.14.0
    imagePullPolicy: IfNotPresent
  vastExtensionController:
    repository: ""
    tag: ""
    imagePullPolicy: IfNotPresent

####################
# VAST CONTROLLER AND NODE BEHAVIOR
#
# WARNING - these parameters are for advanced users.
# Setting these incorrectly may prevent the VAST CSI Driver from running correctly.
#  We recommend to consult with VAST Support before changing any of the following parameters
####################

controller:
  # runOnMaster flag indicated if CSI Controller should be run on master.
  runOnMaster: false
  # runOnControlPlane flag indicated if CSI Controller should be run on control plane node.
  runOnControlPlane: false
  # determine how DNS (Domain Name System) resolution should be handled within Pod.
  # available values: Default, ClusterFirstWithHostNet, ClusterFirst
  dnsPolicy: Default
  # nodeSelector is the way to restrict pod to be assigned on certain node/nodes.
  # Specify node selector if you want node and controller containers to be assigned only to specific node/nodes of
  # your cluster.
  #  https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector.
  nodeSelector: {}
  # If specified, the pod's tolerations
  # https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  tolerations: []
  # Allows to specify which nodes your pod is eligible to be scheduled based on labels on pods that are already running on the node.
  # https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  podAffinity: {}
  # Allows to specify conditions for preventing pods from being scheduled on nodes where certain labels are already present on other pods.
  # https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  podAntiAffinity: {}
  # Allows to specify which nodes your pod is eligible to be scheduled on based on labels on the node
  # https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  nodeAffinity: {}
  # Resources describes the compute resource requirements.
  resources:
    csiProvisioner:
      limits:
        memory: 400Mi
      requests:
        cpu: 10m
        memory: 20Mi
    csiSnapshotter:
      limits:
        memory: 200Mi
      requests:
        cpu: 10m
        memory: 20Mi
    csiAttacher:
      limits:
        memory: 400Mi
      requests:
        cpu: 10m
        memory: 20Mi
    csiResizer:
      limits:
        memory: 300Mi
      requests:
        cpu: 10m
        memory: 20Mi
    csiVastPlugin:
      limits:
        memory: 500Mi
      requests:
        cpu: 100m
        memory: 50Mi
    csiAddonsSidecar:
      limits:
        memory: 200Mi
      requests:
        cpu: 10m
        memory: 20Mi
  extraArgs:
    # For further options, check
    # https://github.com/kubernetes-csi/external-provisioner#command-line-options
    # Example:
    # controller:
    #   extraArgs:
    #     csiProvisioner:
    #       - kube-api-qps=500
    #       - kube-api-burst=1000
    csiProvisioner: []
    # For further options, check
    # https://github.com/kubernetes-csi/external-snapshotter#csi-external-snapshotter-sidecar-command-line-options
    csiSnapshotter: []
    # For further options, check
    # https://github.com/kubernetes-csi/external-attacher#command-line-options
    csiAttacher: []
    # For further options, check
    # https://github.com/kubernetes-csi/external-resizer#recommended-optional-arguments
    csiResizer: []
  # priorityClassName is the name of priority class to be used for the pod.
  priorityClassName: system-cluster-critical
  # Metrics configuration for CSI controller
  # Usage: see docs/METRICS_GUIDE.md (Prometheus Operator vs manual Prometheus)
  metrics:
    # Enable Prometheus metrics endpoint (disabled by default)
    enabled: false
    # Port for metrics HTTP server
    # Note: Using 9093 to avoid conflict with vastcsi controller metrics (9091)
    # Service DNS: <release>-vast-controller-metrics.<namespace>.svc.cluster.local:9093
    port: 9093
    # ServiceMonitor configuration (Prometheus Operator CRD)
    # Ref: https://prometheus-operator.dev/docs/getting-started/introduction/
    # Note: This is ONLY for users with Prometheus Operator installed.
    #       If you use vanilla Prometheus, configure scrape targets manually instead.
    serviceMonitor:
      # Enable ServiceMonitor creation (requires Prometheus Operator installed in cluster)
      enabled: false
      # Scrape interval
      interval: 30s
      # Additional labels for ServiceMonitor
      labels: {}
      # Relabelings to apply to samples before ingestion
      relabelings: []
      # MetricRelabelings to apply to samples before ingestion
      metricRelabelings: []

node:
  # See controller.dnsPolicy section for details
  dnsPolicy: Default
  # See controller.nodeSelector section for details
  nodeSelector: {}
  # See controller.tolerations section for details
  tolerations: []
  # See controller.podAffinity section for details
  podAffinity: {}
  # See controller.podAntiAffinity section for details
  podAntiAffinity: {}
  # See controller.nodeAffinity section for details
  nodeAffinity: {}
  resources:
    nodeDriverRegistrar:
      limits:
        memory: 100Mi
      requests:
        cpu: 10m
        memory: 20Mi
    csiVastPlugin:
      limits:
        memory: 500Mi
      requests:
        cpu: 200m
        memory: 300Mi
  # See controller.priorityClassName section for details
  priorityClassName: system-node-critical
  # Metrics configuration for CSI node
  # Usage: see docs/METRICS_GUIDE.md (Prometheus Operator vs manual Prometheus)
  metrics:
    # Enable Prometheus metrics endpoint (disabled by default; not common to run driver with metrics)
    # See also: https://prometheus.io/docs/concepts/metric_types/
    enabled: false
    # Port for metrics HTTP server
    # Note: Using 9092 to avoid conflict with vastcsi node metrics (9090)
    # Service DNS: <release>-vast-node-metrics.<namespace>.svc.cluster.local:9092
    port: 9092
    # ServiceMonitor configuration (Prometheus Operator CRD)
    # Ref: https://prometheus-operator.dev/docs/getting-started/introduction/
    # Note: This is ONLY for users with Prometheus Operator installed.
    #       If you use vanilla Prometheus, configure scrape targets manually instead.
    serviceMonitor:
      # Enable ServiceMonitor creation (requires Prometheus Operator installed in cluster)
      enabled: false
      # Scrape interval
      interval: 30s
      # Additional labels for ServiceMonitor
      labels: {}
      # Relabelings to apply to samples before ingestion
      relabelings: []
      # MetricRelabelings to apply to samples before ingestion
      metricRelabelings: []

# The path to the kubelet root dir. must be provided when Kubernetes is not installed in its default directory.
kubeletPath: "/var/lib/kubelet"
# rbac flag indicated it Role-based access control from this chart should be used to create apropriate
# permissions for CSI Controller and CSI Node. Use default value unless you understand necessary permissions
# and can provide it other way.
rbac: true
# Reference to one or more secrets to be used when pulling images
# ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
# - name: "image-pull-secret"
imagePullSecrets: []
# Log level of CSI plugin
logLevel: 5
