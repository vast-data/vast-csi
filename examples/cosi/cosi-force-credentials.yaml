# Input Secret — typically synced from Vault via External Secrets Operator
apiVersion: v1
kind: Secret
metadata:
  name: vault-s3-keys
  namespace: app-team
type: Opaque
stringData:
  accessKeyID: "VCSI326FORCEKEY00001"
  accessSecretKey: "vcsi326forcekeabcdefghijklmnopqrstuvwxyz"

---

kind: BucketClass
apiVersion: objectstorage.k8s.io/v1alpha1
driverName: csi.vastdata.com
metadata:
  name: vastdata-bucket
parameters:
  root_export: /cosi
  vip_pool_name: vippool-1
  view_policy: s3_default_policy
  scheme: http

---

kind: BucketClaim
apiVersion: objectstorage.k8s.io/v1alpha1
metadata:
  name: sample-bucket
spec:
  bucketClassName: vastdata-bucket
  protocols:
  - s3

---

kind: BucketAccessClass
apiVersion: objectstorage.k8s.io/v1alpha1
metadata:
  name: vast-bac-force
driverName: csi.vastdata.com
authenticationType: KEY
parameters:
  credentialsSecretName: vault-s3-keys
  credentialsSecretNamespace: app-team

---

kind: BucketAccess
apiVersion: objectstorage.k8s.io/v1alpha1
metadata:
  name: sample-access
spec:
  bucketClaimName: sample-bucket
  bucketAccessClassName: vast-bac-force
  credentialsSecretName: sample-access-secret

# Key rotation:
# 1. ESO syncs Vault -> input Secret (vault-s3-keys)
# 2. Delete and recreate BucketAccess (bucket data is safe)
# 3. Optional: Stakater Reloader restarts pods when output Secret changes — see
#    examples/cosi/cosi-force-credentials-consumer.yaml
