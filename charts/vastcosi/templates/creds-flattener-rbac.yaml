{{- if .Values.credsFlattener.enabled }}
{{/*
  ClusterRole (not namespaced Role): BucketAccess can live in any namespace, same
  as the COSI provisioner chart pattern. Blast radius = cluster-wide Secret AND
  ConfigMap mutate (ConfigMap CRUD is extra vs provisioner, which only has Secrets).
  Acceptable for multi-ns COSI; do not narrow without confirming Jump is single-ns.
*/}}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-creds-flattener-role
  labels:
    {{- include "vastcosilabels" . | nindent 4 }}
rules:
- apiGroups: ["objectstorage.k8s.io"]
  resources: ["bucketaccesses"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-creds-flattener-role-binding
  labels:
    {{- include "vastcosilabels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-creds-flattener-sa
    namespace: {{ include "vastcosinamespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-creds-flattener-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-creds-flattener-sa
  namespace: {{ include "vastcosinamespace" . }}
  labels:
    {{- include "vastcosilabels" . | nindent 4 }}
{{- end }}
