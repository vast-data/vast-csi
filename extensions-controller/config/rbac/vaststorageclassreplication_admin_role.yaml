# This rule is not used by the project extensions-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over vastdata.vastdata.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: extensions-controller
    app.kubernetes.io/managed-by: kustomize
  name: vaststorageclassreplication-admin-role
rules:
- apiGroups:
  - vastdata.vastdata.com
  resources:
  - vaststorageclassreplications
  verbs:
  - '*'
- apiGroups:
  - vastdata.vastdata.com
  resources:
  - vaststorageclassreplications/status
  verbs:
  - get
