# Sample app consuming COSI output credentials (Rook-style volume mount).
# Requires Stakater Reloader in cluster for automatic pod rollout on Secret change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-s3-app
  annotations:
    secret.reloader.stakater.com/reload: "sample-access-secret"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-s3-app
  template:
    metadata:
      labels:
        app: sample-s3-app
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "sleep infinity"]
        volumeMounts:
        - name: cosi-creds
          mountPath: /var/cosi
          readOnly: true
      volumes:
      - name: cosi-creds
        secret:
          secretName: sample-access-secret
