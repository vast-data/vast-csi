# NFS CSI driver with CSI-Addons sidecar for replication.
# Requires VastExtensionsManager in the operator namespace.
apiVersion: storage.vastdata.com/v1
kind: VastCSIDriver
metadata:
  name: csi.vastdata.com
  namespace: vast-csi
spec:
  driverType: nfs
  replicationEnabled: true
  imagePullSecrets:
    - name: regcred
