kind: BucketClass
apiVersion: objectstorage.k8s.io/v1alpha1
driverName: csi.vastdata.com
metadata:
  name: vastdata-bucket
parameters:
  root_export: /cosi-buckets
  vip_pool_name: vippool-1
  view_policy: s3-policy
  max_size: 30Gi
  scheme: http

---

# Per-tenant BucketClass: tenant-admin Secret + DNS endpoint (vipPoolFQDN).
kind: BucketClass
apiVersion: objectstorage.k8s.io/v1alpha1
driverName: csi.vastdata.com
metadata:
  name: vastdata-bucket-team-a
parameters:
  view_policy: s3-policy-team-a
  vip_pool_fqdn: s3-team-a.example.com
  vip_pool_fqdn_random_prefix: "true"
  root_export: /cosi/team-a
  scheme: https
  vastdata.com/secret-name: team-a-vast-auth
  vastdata.com/secret-namespace: app-team

---

kind: BucketClaim
apiVersion: objectstorage.k8s.io/v1alpha1
metadata:
  name: sample-bucket
spec:
  bucketClassName: vastdata-bucket
  protocols:
  - s3

---

kind: BucketAccessClass
apiVersion: objectstorage.k8s.io/v1alpha1
metadata:
  name: sample-bac
driverName: csi.vastdata.com
authenticationType: KEY

---

kind: BucketAccess
apiVersion: objectstorage.k8s.io/v1alpha1
metadata:
  name: sample-access
spec:
  bucketClaimName: sample-bucket
  bucketAccessClassName: sample-bac
  credentialsSecretName: sample-access-secret

---
