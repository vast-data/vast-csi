                          - DropEqual
                      regex:
                        type: string
                        description: Regular expression against which the extracted value is matched
                      replacement:
                        type: string
                        nullable: true
                        description: Replacement value against which a Replace action is performed if the regex matches. Regex capture groups are available.
                      separator:
                        type: string
