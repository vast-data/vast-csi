apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: csi-block-from-snap
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: vastdata-filesystem
  dataSource:
    name: snap
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
