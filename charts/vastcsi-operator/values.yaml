  csiAddonsController:
    repository: quay.io/csiaddons/k8s-controller@sha256:412ed46f1f93a49aea6a6cb9c33e3bcb131f96bfe3d015314611c27282f472aa
  vastExtensionController:
    repository: docker.io/vastdataorg/csi@sha256:f6561aa2270a1acbd8a1cb20a37923304f3eca171819d8d142f7f52585146cff

# Disable if you don't have intention to use snapshots (Enabled by default)
installSnapshotCRDS: true

####################
# BUNDLE SETTINGS
####################
# Build based on the OLM bundle: https://olm.operatorframework.io/
# Do not change this unless you fully understand all implications.
# Enabling this option (true) will generate a different template. It skips all roles, role bindings, and the operator manager deployment.
# Instead, these templates become part of the installation section of the ClusterServiceVersion.
# This option is intended for clusters with OLM installed, where the intention is to install and manage the operator via OLM.
olmBuild: false
maturity: "stable"

# The version that this operator replaces in the upgrade graph.
# Example: "2.6.5" will generate "replaces: vast-csi-operator.v2.6.5"
# Leave empty when expanding OCP support beyond the previous bundle's catalogs;
# use skipRange instead so check_replaces_availability can pass.
# Empty for 2.6.7: replaces 2.6.5 fails because 2.6.5 is only v4.19-v4.21 while
# this release needs v4.18-v4.22 (cannot widen published 2.6.5).
replacesVersion: ""

# SemVer range of installed versions that can upgrade directly to this release.
# Keep narrow — broad ranges (e.g. ">=2.5.0 <2.6.7") skip intermediate bundles
# and remove the option to stay on or install an older version such as 2.6.5.
# "=2.6.6" targets broken 2.6.6 installs only (delete 2.6.6 from catalog first).
skipRange: "=2.6.6"
