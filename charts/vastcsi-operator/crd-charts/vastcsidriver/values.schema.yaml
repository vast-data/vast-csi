    path: image.csiVastPlugin.repository
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - *use-custom-images-dep
  - description: Custom CSI Attacher image.
    displayName: CSI Attacher image
    path: image.csiAttacher.repository
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - *use-custom-images-dep
  - description: Custom CSI NodeDriverRegistrar image.
    displayName: CSI NodeDriverRegistrar image
    path: image.csiNodeDriverRegistrar.repository
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - *use-custom-images-dep
  - description: Custom CSI Provisioner image.
    displayName: CSI Provisioner image
    path: image.csiProvisioner.repository
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - *use-custom-images-dep
  - description: Custom CSI Resizer image.
    displayName: CSI Resizer image
    path: image.csiResizer.repository
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - *use-custom-images-dep
  - description: Custom CSI Snapshotter image.
    displayName: CSI Snapshotter image
    path: image.csiSnapshotter.repository
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - *use-custom-images-dep
  - description: Custom CSI-Addons sidecar image (replication only).
    displayName: CSI-Addons sidecar image
    path: image.csiAddonsSidecar.repository
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - *use-custom-images-dep
      - *replication-enabled-dep
  - description: Image pull policy for Vast CSI driver container.
    displayName: Vast CSI driver image pull policy
    path: image.csiVastPlugin.imagePullPolicy
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  - description: Image pull policy for CSI Attacher container.
    displayName: CSI Attacher image pull policy
    path: image.csiAttacher.imagePullPolicy
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  - description: Image pull policy for CSI NodeDriverRegistrar container.
    displayName: CSI NodeDriverRegistrar image pull policy
    path: image.csiNodeDriverRegistrar.imagePullPolicy
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  - description: Image pull policy for CSI Provisioner container.
    displayName: CSI Provisioner image pull policy
    path: image.csiProvisioner.imagePullPolicy
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  - description: Image pull policy for CSI Resizer container.
    displayName: CSI Resizer image pull policy
    path: image.csiResizer.imagePullPolicy
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  - description: Image pull policy for CSI Snapshotter container.
    displayName: CSI Snapshotter image pull policy
    path: image.csiSnapshotter.imagePullPolicy
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  - description: Image pull policy for CSI-Addons sidecar container.
    displayName: CSI-Addons sidecar image pull policy
    path: image.csiAddonsSidecar.imagePullPolicy
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  # Hidden fields. The field(s) will be hidden on the UI but can still be accessed through the YAML editor.
  # Delete "hidden" descriptor if you think field should be visible.
  - description: |-
      Name of the global secret that holds VAST credentials. 
      For improved granularity per StorageClass, it's advisable to define the secret as a VastStorage CRD.
    displayName: secretName
    path: secretName
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  - description: API endpoint of VAST appliance - should be provided by user if "global" secretName is provided.
    displayName: endpoint
    path: endpoint
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  - description: |-
      Name of the secret that holds the SSL certificates for the VAST appliance.
      For improved granularity per StorageClass, it's advisable to define the SSL certificate as a part VastStorage CRD.
    displayName: sslCertsSecretName
    path: sslCertsSecretName
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  - description: Path (absolute or relative) to SSL certificate for verifying the VAST REST API.
    displayName: sslCert
    path: sslCert
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  - description: |-
      Indicates this CSI driver requires an attachment operation as it implements the ControllerPublishVolume
      if set to false, the driver will perform ControllerPublishVolume as a part of NodePublishVolume op
      which might speed up the volume attach operation significantly but not appropriate for workload nodes where
      http/https ports are not open.
    displayName: attachRequired
    path: attachRequired
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  - description: Global deletionViewPolicy
    displayName: deletionViewPolicy
    path: deletionViewPolicy
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  - description: Global deletionVipPool
    displayName: deletionVipPool
    path: deletionVipPool
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  - description: >-
      The logging level of deployed containers expressed as an integer
      from 0 (low detail) to 5 (high detail). 0 only logs errors. 3 logs most
      RPC requests/responses and some detail about driver actions.
    displayName: logLevel
    path: logLevel
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  - description: |-
      Each time a failure occurs, sidecar containers initiate retries
      but only after waiting for 'operationRetryIntervalStart' seconds
      which then doubles with each subsequent failure  until it reaches `operationRetryIntervalMax`.
    displayName: operationRetryIntervalStart
    path: operationRetryIntervalStart
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  - description:  Maximum interval between attempts.
    displayName: operationRetryIntervalMax
    path: operationRetryIntervalMax
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  - description: Truncate VAST quota name if name length is greater than this number. set truncateVolumeName as null to disable truncation.
    displayName: truncateVolumeName
    path: truncateVolumeName
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  - description: |-
      (Block driver only) Automatically prune unused host entries (NQNs) from the VMS when they are no longer
      in use by any PVCs. This prevents host sprawl in dynamic Kubernetes environments with
      ephemeral node pools and changing hostnames.
    displayName: Block Hosts Auto Prune
    path: blockHostsAutoPrune
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - description: >-
      (Block driver only) Prefix used when naming CSI block hosts (e.g. csi-<node-id>).
      Leave empty to use the default naming scheme.
    displayName: Host Name Prefix
    path: hostNamePrefix
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
      - *block-driver-dep
  - description: >-
      Timeout in seconds for mount/umount operations.
      If a mount or umount command does not complete within this time, it will be terminated
      and an error will be returned.
    displayName: Mount/Umount Timeout
    path: mountUmountTimeout
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:number'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - description: >-
      Enable symlink resolution when querying mount information.
      When enabled, mount paths containing symlinks will be resolved to their canonical paths
      before comparison.
    displayName: Resolve Mount Symlinks
    path: resolveMountSymlinks
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - description: |-
      (Block driver only) Enable ReadOnlyMany (ROX) access mode for block filesystem volumes.
      When enabled, multiple pods across different nodes can mount the same block volume
      in read-only mode with OS-level read-only enforcement.
    displayName: Allow ROX Block Filesystem Mode
    path: allowROManyBlockFsMode
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
      - *block-driver-dep
  - description: >-
      Disable sending usage statistics to VAST cluster.
      When set to true, the CSI driver will not report plugin usage metrics to VMS.
    displayName: Disable Usage Stats
    path: disableUsageStats
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - description: >-
      Cache-Control max-age header value in seconds for VMS API requests.
      Set to 0 to disable caching.
    displayName: Cache Max Age Seconds
    path: cacheMaxAgeSeconds
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:number'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - description: Enable Prometheus metrics endpoint for CSI controller
    displayName: Controller Metrics Enabled
    path: controller.metrics.enabled
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
  - description: Port for controller metrics HTTP server
    displayName: Controller Metrics Port
    path: controller.metrics.port
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:number'
      - 'urn:alm:descriptor:com.tectonic.ui:fieldDependency:controller.metrics.enabled:true'
  - description: ServiceMonitor configuration for controller metrics (Prometheus Operator CRD)
    displayName: Controller ServiceMonitor
    path: controller.metrics.serviceMonitor
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:fieldDependency:controller.metrics.enabled:true'
  - description: Enable ServiceMonitor creation for controller metrics (requires Prometheus Operator)
    displayName: Controller ServiceMonitor Enabled
    path: controller.metrics.serviceMonitor.enabled
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
      - 'urn:alm:descriptor:com.tectonic.ui:fieldDependency:controller.metrics.enabled:true'
  - description: Scrape interval for controller ServiceMonitor (e.g. 30s, 1m)
    displayName: Controller ServiceMonitor Interval
    path: controller.metrics.serviceMonitor.interval
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - 'urn:alm:descriptor:com.tectonic.ui:fieldDependency:controller.metrics.serviceMonitor.enabled:true'
  - description: Additional labels for the controller ServiceMonitor resource (array of {name, value} pairs)
    displayName: Controller ServiceMonitor Labels
    path: controller.metrics.serviceMonitor.labels
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:fieldDependency:controller.metrics.serviceMonitor.enabled:true'
  - description: Relabelings to apply to controller metrics samples before ingestion (array of RelabelConfig objects)
    displayName: Controller ServiceMonitor Relabelings
    path: controller.metrics.serviceMonitor.relabelings
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:fieldDependency:controller.metrics.serviceMonitor.enabled:true'
  - description: MetricRelabelings to apply to controller metrics samples before ingestion (array of RelabelConfig objects)
    displayName: Controller ServiceMonitor MetricRelabelings
    path: controller.metrics.serviceMonitor.metricRelabelings
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:fieldDependency:controller.metrics.serviceMonitor.enabled:true'
  - description: Enable Prometheus metrics endpoint for CSI node
    displayName: Node Metrics Enabled
    path: node.metrics.enabled
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
  - description: Port for node metrics HTTP server
    displayName: Node Metrics Port
    path: node.metrics.port
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:number'
      - 'urn:alm:descriptor:com.tectonic.ui:fieldDependency:node.metrics.enabled:true'
  - description: ServiceMonitor configuration for node metrics (Prometheus Operator CRD)
    displayName: Node ServiceMonitor
    path: node.metrics.serviceMonitor
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:fieldDependency:node.metrics.enabled:true'
  - description: Enable ServiceMonitor creation for node metrics (requires Prometheus Operator)
    displayName: Node ServiceMonitor Enabled
    path: node.metrics.serviceMonitor.enabled
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
      - 'urn:alm:descriptor:com.tectonic.ui:fieldDependency:node.metrics.enabled:true'
  - description: Scrape interval for node ServiceMonitor (e.g. 30s, 1m)
    displayName: Node ServiceMonitor Interval
    path: node.metrics.serviceMonitor.interval
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - 'urn:alm:descriptor:com.tectonic.ui:fieldDependency:node.metrics.serviceMonitor.enabled:true'
  - description: Additional labels for the node ServiceMonitor resource (array of {name, value} pairs)
    displayName: Node ServiceMonitor Labels
    path: node.metrics.serviceMonitor.labels
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:fieldDependency:node.metrics.serviceMonitor.enabled:true'
  - description: Relabelings to apply to node metrics samples before ingestion (array of RelabelConfig objects)
    displayName: Node ServiceMonitor Relabelings
    path: node.metrics.serviceMonitor.relabelings
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:fieldDependency:node.metrics.serviceMonitor.enabled:true'
  - description: MetricRelabelings to apply to node metrics samples before ingestion (array of RelabelConfig objects)
    displayName: Node ServiceMonitor MetricRelabelings
    path: node.metrics.serviceMonitor.metricRelabelings
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:fieldDependency:node.metrics.serviceMonitor.enabled:true'
  - description: Enable in-container NFS client daemons for NFS locking/idmap on node OSes that lack them.
    displayName: NFS Services Enabled
    path: node.nfsServices.enabled
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
      - *nfs-driver-dep
  - description: NFS client daemons to run in the node pod. Add each daemon as a separate list entry (statd, rpcbind, idmapd, mountd, tlshd).
    displayName: NFS Services
    path: node.nfsServices.services
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:fieldDependency:node.nfsServices.enabled:true'
      - *nfs-driver-dep
  - description: When true, a umount that times out is retried with lazy unmount (-l).
    displayName: Force Lazy Umount On Timeout
    path: forceLazyUmountOnTimeout
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - description: |-
      Secret that encrypts EV credentials. Must contain a `key` field.
      Empty: store credentials as plaintext JSON.
      Example: kubectl create secret generic vast-cred-serde --from-literal=key="$(openssl rand -base64 32)"
    displayName: Credential Serialization Secret
    path: credSerializationSecret
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - description: |-
      When true, unpublish of already-mounted EV volumes may use legacy AES-CFB+pickle
      metadata and a .vast-csi-meta file on local disk (no tmpfs). New publishes always
      use tmpfs. Leave false (disabled) unless upgrading a cluster that still has
      old-format EV volumes mounted; set false again after they unpublish.
    displayName: Fallback To Legacy EV Deserializer
    path: fallbackToDeser
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - description: Replication plugin settings for the dedicated CSI-Addons sidecar Deployment.
    displayName: Replication Plugin
    path: csiAddonsSidecar
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
      - *replication-enabled-dep
  - description: Timeout for replication operations handled by the replication plugin (seconds).
    displayName: Replication Operation Timeout
    path: csiAddonsSidecar.operationTimeout
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:number'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
      - *replication-enabled-dep
example:
  apiVersion: storage.vastdata.com/v1
  kind: VastCSIDriver
  metadata:
    name: {{ .GlobalValues.name }}
  spec:
    controller:
      podAffinity: {}
      podAntiAffinity: {}
      nodeAffinity: {}
      dnsPolicy: {{ .Values.controller.dnsPolicy }}
      nodeSelector: {}
      tolerations: {{ .Values.controller.tolerations }}
      runOnControlPlane: {{ .Values.controller.runOnControlPlane }}
      runOnMaster: {{ .Values.controller.runOnMaster }}
      resources:
        csiAttacher:
          limits:
            memory: {{ .Values.controller.resources.csiAttacher.limits.memory }}
          requests:
            cpu: {{ .Values.controller.resources.csiAttacher.requests.cpu }}
            memory: {{ .Values.controller.resources.csiAttacher.requests.memory }}
        csiProvisioner:
          limits:
            memory: {{ .Values.controller.resources.csiProvisioner.limits.memory }}
          requests:
            cpu: {{ .Values.controller.resources.csiProvisioner.requests.cpu }}
            memory: {{ .Values.controller.resources.csiProvisioner.requests.memory }}
        csiResizer:
          limits:
            memory: {{ .Values.controller.resources.csiResizer.limits.memory }}
          requests:
            cpu: {{ .Values.controller.resources.csiResizer.requests.cpu }}
            memory: {{ .Values.controller.resources.csiResizer.requests.memory }}
        csiSnapshotter:
          limits:
            memory: {{ .Values.controller.resources.csiSnapshotter.limits.memory }}
          requests:
            cpu: {{ .Values.controller.resources.csiSnapshotter.requests.cpu }}
            memory: {{ .Values.controller.resources.csiSnapshotter.requests.memory }}
        csiVastPlugin:
          limits:
            memory: {{ .Values.controller.resources.csiVastPlugin.limits.memory }}
          requests:
            cpu: {{ .Values.controller.resources.csiVastPlugin.requests.cpu }}
            memory: {{ .Values.controller.resources.csiVastPlugin.requests.memory }}
      extraArgs:
        csiProvisioner: {{ .Values.controller.extraArgs.csiProvisioner }}
        csiSnapshotter: {{ .Values.controller.extraArgs.csiSnapshotter }}
        csiAttacher: {{ .Values.controller.extraArgs.csiAttacher }}
        csiResizer: {{ .Values.controller.extraArgs.csiResizer }}
      metrics:
        enabled: {{ .Values.controller.metrics.enabled }}
        port: {{ .Values.controller.metrics.port }}
        serviceMonitor:
          enabled: {{ .Values.controller.metrics.serviceMonitor.enabled }}
          interval: {{ .Values.controller.metrics.serviceMonitor.interval }}
          labels: []
          relabelings: []
          metricRelabelings: []
    node:
      podAffinity: {}
      podAntiAffinity: {}
      nodeAffinity: {}
      dnsPolicy: {{ .Values.node.dnsPolicy }}
      nodeSelector: {}
      tolerations: {{ .Values.node.tolerations }}
      propagateHostMountOptions: {{ .Values.node.propagateHostMountOptions }}
      hostBinarySearchDirs: {{ .Values.node.hostBinarySearchDirs | quote }}
      resources:
        csiVastPlugin:
          limits:
            memory: {{ .Values.node.resources.csiVastPlugin.limits.memory }}
          requests:
            cpu: {{ .Values.node.resources.csiVastPlugin.requests.cpu }}
            memory: {{ .Values.node.resources.csiVastPlugin.requests.memory }}
        nodeDriverRegistrar:
          limits:
            memory: {{ .Values.node.resources.nodeDriverRegistrar.limits.memory }}
          requests:
            cpu: {{ .Values.node.resources.nodeDriverRegistrar.requests.cpu }}
            memory: {{ .Values.node.resources.nodeDriverRegistrar.requests.memory }}
        nfsServices:
          limits:
            memory: {{ .Values.node.resources.nfsServices.limits.memory }}
          requests:
            cpu: {{ .Values.node.resources.nfsServices.requests.cpu }}
            memory: {{ .Values.node.resources.nfsServices.requests.memory }}
      nfsServices:
        enabled: {{ .Values.node.nfsServices.enabled }}
        services: {{ .Values.node.nfsServices.services | toJson }}
      metrics:
        enabled: {{ .Values.node.metrics.enabled }}
        port: {{ .Values.node.metrics.port }}
        serviceMonitor:
          enabled: {{ .Values.node.metrics.serviceMonitor.enabled }}
          interval: {{ .Values.node.metrics.serviceMonitor.interval }}
          labels: []
          relabelings: []
          metricRelabelings: []
    image:
      useCustomRepositories: false
      csiAttacher:
        imagePullPolicy: {{ .Values.image.csiAttacher.imagePullPolicy }}
      csiNodeDriverRegistrar:
        imagePullPolicy: {{ .Values.image.csiNodeDriverRegistrar.imagePullPolicy }}
      csiProvisioner:
        imagePullPolicy: {{ .Values.image.csiProvisioner.imagePullPolicy }}
      csiResizer:
        imagePullPolicy: {{ .Values.image.csiResizer.imagePullPolicy }}
      csiSnapshotter:
        imagePullPolicy: {{ .Values.image.csiSnapshotter.imagePullPolicy }}
      csiVastPlugin:
        imagePullPolicy: {{ .Values.image.csiVastPlugin.imagePullPolicy }}
      csiAddonsSidecar:
        imagePullPolicy: {{ .Values.image.csiAddonsSidecar.imagePullPolicy }}
    deletionViewPolicy: {{ .Values.deletionViewPolicy }}
    deletionVipPool: {{ .Values.deletionVipPool }}
    dontUseTrashApi: {{ .Values.dontUseTrashApi }}
    imagePullSecrets: {{ empty .GlobalValues.imagePullSecret | ternary "[]" (printf "[{\"name\": \"%s\"}]" .GlobalValues.imagePullSecret) }}
    kubeletPath: {{ .Values.kubeletPath }}
    logLevel: {{ .Values.logLevel }}
    numWorkers: {{ .Values.numWorkers }}
    operationRetryIntervalMax: {{ .Values.operationRetryIntervalMax }}
    operationRetryIntervalStart: {{ .Values.operationRetryIntervalStart }}
    operationTimeout: {{ .Values.operationTimeout }}
    truncateVolumeName: {{ .Values.truncateVolumeName }}
    blockHostsAutoPrune: {{ .Values.blockHostsAutoPrune }}
    hostNamePrefix: {{ .Values.hostNamePrefix | quote }}
    mountUmountTimeout: {{ .Values.mountUmountTimeout }}
    forceLazyUmountOnTimeout: {{ .Values.forceLazyUmountOnTimeout }}
    credSerializationSecret: {{ .Values.credSerializationSecret | quote }}
    fallbackToDeser: {{ .Values.fallbackToDeser }}
    resolveMountSymlinks: {{ .Values.resolveMountSymlinks }}
    allowROManyBlockFsMode: {{ .Values.allowROManyBlockFsMode }}
    disableUsageStats: {{ .Values.disableUsageStats }}
    cacheMaxAgeSeconds: {{ .Values.cacheMaxAgeSeconds }}
    useLocalIpForMount: {{ .Values.useLocalIpForMount }}
    verifySsl: {{ .Values.verifySsl }}
    driverType: {{ .Values.driverType }}
    secretName: {{ .Values.secretName }}
    endpoint: {{ .Values.endpoint }}
    sslCertsSecretName: {{ .Values.sslCertsSecretName }}
    attachRequired: {{ .Values.attachRequired }}
    replicationEnabled: {{ .Values.replicationEnabled }}
    csiAddonsSidecar:
      operationTimeout: {{ .Values.csiAddonsSidecar.operationTimeout }}
      resources:
        csiVastPlugin:
          limits:
            memory: {{ .Values.csiAddonsSidecar.resources.csiVastPlugin.limits.memory }}
          requests:
            cpu: {{ .Values.csiAddonsSidecar.resources.csiVastPlugin.requests.cpu }}
            memory: {{ .Values.csiAddonsSidecar.resources.csiVastPlugin.requests.memory }}
        csiAddonsSidecar:
          limits:
            memory: {{ .Values.csiAddonsSidecar.resources.csiAddonsSidecar.limits.memory }}
          requests:
            cpu: {{ .Values.csiAddonsSidecar.resources.csiAddonsSidecar.requests.cpu }}
            memory: {{ .Values.csiAddonsSidecar.resources.csiAddonsSidecar.requests.memory }}
    applySecurityContextConstraints: {{ .Values.applySecurityContextConstraints }}