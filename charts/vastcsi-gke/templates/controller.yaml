{{/* Vast CSI Controller */}}

{{- $csi_images := .Values.image -}}
{{- $driver_name := include "vast.common.csi.driverName" . -}}
{{- $csi_sock := printf "%s.sock" ($driver_name | lower | replace "." "-" | replace "_" "-" | trimSuffix "-" | trimPrefix "-") -}}
{{- $plugin_proxy_sock := printf "/var/lib/csi/sockets/pluginproxy/%s" $csi_sock -}}
{{- $plugin_proxy_sock_path := "/var/lib/csi/sockets/pluginproxy/" -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: csi-vast-controller
  namespace: {{ include "vast.common.namespace" . }}
  labels:
{{- include "vast.common.labels" . | nindent 4 }}
    app.kubernetes.io/csi-role: "controller"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: csi-vast-controller
{{- include "vast.common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        role: csi-vast
        app: csi-vast-controller
{{- include "vast.common.selectorLabels" . | nindent 8 }}
    spec:
{{- include "vast.common.imagePullSecrets" (dict "secrets" .Values.imagePullSecrets) | nindent 6 }}
      affinity:
        podAffinity:
          {{- toYaml .Values.controller.podAffinity | nindent 10 }}
        podAntiAffinity:
          {{- toYaml .Values.controller.podAntiAffinity | nindent 10 }}
        nodeAffinity:
          {{- toYaml .Values.controller.nodeAffinity | nindent 10 }}
      containers:
        - name: csi-provisioner
          image: {{ include "vast.common.image" (dict "root" $ "image" $csi_images.csiProvisioner) }}
          args:
{{- include "vast.common.csi.args" . | nindent 12 }}
            - "--extra-create-metadata"
            - "--timeout={{ .Values.operationTimeout }}s"
            - "--worker-threads={{ .Values.numWorkers }}"
            - "--retry-interval-start={{ .Values.operationRetryIntervalStart }}s"
            - "--retry-interval-max={{ .Values.operationRetryIntervalMax }}s"
            {{- range .Values.controller.extraArgs.csiProvisioner }}
            - "--{{ . }}"
            {{- end }}
          env:
            - name: ADDRESS
              value: {{ $plugin_proxy_sock }}
          imagePullPolicy: {{ $csi_images.csiProvisioner.imagePullPolicy | default  "IfNotPresent" }}
          volumeMounts:
            - name: socket-dir
              mountPath: {{ $plugin_proxy_sock_path }}
          resources: {{- toYaml .Values.controller.resources.csiProvisioner | nindent 12 }}
        - name: csi-attacher
          image: {{ include "vast.common.image" (dict "root" $ "image" $csi_images.csiAttacher) }}
          args:
{{- include "vast.common.csi.args" . | nindent 12 }}
            - "--timeout={{ .Values.operationTimeout }}s"
            - "--worker-threads={{ .Values.numWorkers }}"
            - "--retry-interval-start={{ .Values.operationRetryIntervalStart }}s"
            - "--retry-interval-max={{ .Values.operationRetryIntervalMax }}s"
            {{- range .Values.controller.extraArgs.csiAttacher }}
            - "--{{ . }}"
            {{- end }}
          env:
            - name: ADDRESS
              value: {{ $plugin_proxy_sock }}
          imagePullPolicy: {{ $csi_images.csiAttacher.imagePullPolicy | default  "IfNotPresent" }}
          volumeMounts:
            - name: socket-dir
              mountPath: {{ $plugin_proxy_sock_path }}
          resources: {{- toYaml .Values.controller.resources.csiAttacher | nindent 12 }}
        - name: csi-snapshotter
          image: {{ include "vast.common.image" (dict "root" $ "image" $csi_images.csiSnapshotter) }}
          args:
{{- include "vast.common.csi.args" . | nindent 12 }}
            - "--extra-create-metadata"
            - "--leader-election=false"
            - "--timeout={{ .Values.operationTimeout }}s"
            - "--worker-threads={{ .Values.numWorkers }}"
            - "--retry-interval-start={{ .Values.operationRetryIntervalStart }}s"
            - "--retry-interval-max={{ .Values.operationRetryIntervalMax }}s"
            {{- range .Values.controller.extraArgs.csiSnapshotter }}
            - "--{{ . }}"
            {{- end }}
          env:
            - name: ADDRESS
              value: {{ $plugin_proxy_sock }}
          imagePullPolicy: {{ $csi_images.csiSnapshotter.imagePullPolicy | default  "IfNotPresent" }}
          volumeMounts:
            - name: socket-dir
              mountPath: {{ $plugin_proxy_sock_path }}
          resources: {{- toYaml .Values.controller.resources.csiSnapshotter | nindent 12 }}
        - name: csi-resizer
          image: {{ include "vast.common.image" (dict "root" $ "image" $csi_images.csiResizer) }}
          args:
{{- include "vast.common.csi.args" . | nindent 12 }}
            - "--timeout={{ .Values.operationTimeout }}s"
            - "--workers={{ .Values.numWorkers }}"
            - "--retry-interval-start={{ .Values.operationRetryIntervalStart }}s"
            - "--retry-interval-max={{ .Values.operationRetryIntervalMax }}s"
            - "--handle-volume-inuse-error=false"
            {{- range .Values.controller.extraArgs.csiResizer }}
            - "--{{ . }}"
            {{- end }}
          env:
            - name: ADDRESS
              value: {{ $plugin_proxy_sock }}
          imagePullPolicy: {{ $csi_images.csiResizer.imagePullPolicy | default  "IfNotPresent" }}
          volumeMounts:
            - name: socket-dir
              mountPath: {{ $plugin_proxy_sock_path }}
          resources: {{- toYaml .Values.controller.resources.csiResizer | nindent 12 }}
        - name: csi-vast-plugin
          image: {{ include "vast.common.image" (dict "root" $ "image" $csi_images.csiVastPlugin) }}
          args:
            - "serve"
            - "--plugin=nfs"
          imagePullPolicy: {{ $csi_images.csiVastPlugin.imagePullPolicy | default  "IfNotPresent" }}
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: true
          env:
{{- include "vastcsi.commonEnv" . | indent 12 }}
            - name: CSI_ENDPOINT
              value: unix://{{ $plugin_proxy_sock }}
            - name: X_CSI_MODE
              value: controller
            - name: X_CSI_METRICS_ENABLED
              value: "{{ .Values.controller.metrics.enabled }}"
            - name: X_CSI_METRICS_PORT
              value: "{{ .Values.controller.metrics.port }}"
{{- if .Values.controller.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.controller.metrics.port }}
              protocol: TCP
{{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: {{ $plugin_proxy_sock_path }}
{{- include "vast.common.vmsAuth.volumeMounts" . | indent 12 }}
          resources: {{- toYaml .Values.controller.resources.csiVastPlugin | nindent 12 }}
      hostNetwork: true
      dnsPolicy: {{ .Values.controller.dnsPolicy }}
      nodeSelector:
{{- if .Values.controller.runOnMaster}}
        node-role.kubernetes.io/master: ""
        {{- end }}
{{- if .Values.controller.runOnControlPlane }}
        node-role.kubernetes.io/control-plane: ""
        {{- end }}
{{- if .Values.controller.nodeSelector }}
{{ toYaml .Values.controller.nodeSelector | indent 8 }}
      {{- end }}
      priorityClassName: {{ .Values.controller.priorityClassName }}
      serviceAccountName: {{ .Release.Name }}-vast-controller-sa
      tolerations:
{{ toYaml .Values.controller.tolerations | indent 8 }}
      volumes:
        - name: socket-dir
          emptyDir: {}
{{- include "vast.common.vmsAuth.volumes" . | indent 8 }}
