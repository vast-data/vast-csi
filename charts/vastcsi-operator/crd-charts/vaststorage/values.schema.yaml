description: >
  Represents VAST storage. Each VastStorage instance generates a corresponding
  storage class that can be used in PVCs to create workloads.

spec:
  description: Spec defines the desired state of VastStorage.
  properties:
    driverType:
      description: Choose the driver type for VastStorage.
      type: string
      default: {{ .Values.driverType }}
      enum:
        - nfs
        - block
    provisioner:
      description: The name of VastDriver provisioner reference.
      type: string
    nfsProvisioner:
      description: >
        [OLM Console only] Used internally by the OpenShift UI form when driverType is 'nfs'.
        Automatically sets provisioner. Should not be set manually in YAML mode.
      type: string
    blockProvisioner:
      description: >
        [OLM Console only] Used internally by the OpenShift UI form when driverType is 'block'.
        Automatically sets provisioner. Should not be set manually in YAML mode.
      type: string
    secretName:
      description: The name of VMS Secret object.
      type: string
      default: ""
    secretNamespace:
      description: Secret namespace. If not specified, the Secret will be looked up in the same namespace where the Operator is running.
      type: string
      default: ""
    clusterName:
      description: The name of VastCluster reference.
      type: string
      default: ""
    storagePath:
      description: Base path where volumes will be located on VAST.
      type: string
      default: ""
    viewPolicy:
      description: VAST policy name to create views.
      type: string
      default: ""
    vipPool:
      description: Name of VAST VIP pool to use.
      type: string
      nullable: true
    vipPoolFQDN:
      description: |-
        The FQDN of the VIP pool to use. Must specify either vipPool or vipPoolFQDN.
        Using a DNS skips an API call to the VMS for obtaining a random VIP from the vipPool, 
        leading to faster volume mounting.
        NOTE: The driver will prepend the FQDN with a random prefix, which forces the NFS client 
        to resolve into a different VIP, thereby distributing the load across the entire range 
        of the VIP pool.
      nullable: true
      type: string
    vipPoolFQDNRandomPrefix:
      description: >-
          Helps distribute load across the entire VIP pool by randomizing the VIP resolved for each volume mount.
          If set to true, a random prefix will be added to the VIP FQDN, ensuring that each NFS mount 
          request resolves to a different VIP from the VIP pool.
      type: boolean
      default: true
    qosPolicy:
      description: Name of QoS policy associated with the view or volume.
      type: string
      nullable: true
    blockingClones:
      description: |-
        If true, the CSI driver will wait for the GSS (global snapshot stream) process to fully complete
        before returning from a volume clone operation.

        This ensures the volume is fully usable and consistent at the time of provisioning, but may add
        significant latency if the underlying GSS operation is long-running.

        If false (default), the driver returns as soon as the clone operation is initiated, allowing
        Kubernetes to proceed while the data stream continues in the background.
      type: boolean
      default: false
    hostEncryption:
      description: |-
        Enables encryption using LUKS on the device at the client side.
        If set, the CSI driver will expect a `passphrase` to be provided in the vast-mgmt Kubernetes Secret.
      type: object
      nullable: true
      properties:
        cipher:
          type: string
          nullable: true
          description: Encryption cipher used for LUKS.
        key_size:
          type: integer
          nullable: true
          description: Key size in bits, e.g., 256 or 512. Must be supported by the selected cipher
        hash:
          type: string
          nullable: true
          description: Hash algorithm used for key derivation.
        pbkdf_memory:
          type: integer
          nullable: true
          description: Memory cost for PBKDF in kilobytes.
    subsystem:
      description: VAST subsystem for volume creation.
      type: string
      default: ""
    tenantName:
      description:  Tenant name – required for additional filtering when multiple subsystems share the same name.
      type: string
      nullable: true
    volumeGroup:
      description: |-
          Optional template for constructing common volume prefix.
          It supports placeholders for the PVC name, namespace, and ID,
          which can be used in the format {namespace}, {name}, and {id}.
          If not provided, a default template will be used. The volume group
          can represent nested folder structures. For example:
           - "folder1/folder2/block-{namespace}-{id}
      type: string
      nullable: true
    fsType:
      description: Filesystem type for volume creation.
      type: string
      enum:
          - ""
          - ext4
          - ext3
          - xfs
      nullable: true
    transportType:
      description: Host connectivity type used for block storage.
      type: string
      enum:
          - ""
          - TCP
          - RDMA
      nullable: true
    allowVolumeExpansion:
      description: Allows resizing existing volumes.
      default: true
      type: boolean
    mountOptions:
      description: Add any extra mount NFS options here.
      default: []
      type: array
      items:
        type: string
    reclaimPolicy:
      description: >-
        Reclaim policy defines what happens to the volume when the corresponding
        PersistentVolumeClaim (PVC) is deleted.
        See https://kubernetes.io/docs/concepts/storage/storage-classes/#reclaim-policy 
        for more details.
      default: Delete
      enum:
        - Delete
        - Retain
      type: string
    setDefaultStorageClass:
      description: >-
        When enabled, Vast CSI will be set as the default storage class for the entire 
        Kubernetes cluster. This means Vast CSI will automatically be chosen as the 
        storage class for persistent volume claims (PVCs) that do not specify a 
        storage class.
        See https://kubernetes.io/docs/concepts/storage/storage-classes/#default-storageclass 
        for more details.
      type: boolean
      default: false
    volumeNameFormat:
      description: String template for CSI-provisioned volume names, within VAST.
      default: csi:{namespace}:{name}:{id}
      type: string
    ephemeralVolumeNameFormat:
      description: String template for CSI-provisioned ephemeral volumes, within VAST.
      default: csi:{namespace}:{name}:{id}
      type: string
    createSnapshotClass:
      description: Create SnapshotClass for VastStorage.
      type: boolean
      default: true
    snapshotClass:
      description: VolumeSnapshotClass definition.
      properties:
        snapshotNameFormat:
          type: string
          default: csi:{namespace}:{name}:{id}
        deletionPolicy:
          description: >-
            Specifies the deletion policy for snapshots associated with this snapshot class.
            See https://kubernetes.io/docs/concepts/storage/volume-snapshot-classes/#deletionpolicy 
            for more details.
          default: Delete
          enum:
            - Delete
            - Retain
          type: string
        setDefaultSnapshotClass:
          description: >-
            When enabled, this sets the VAST CSI Snapshot Class as the default for creating 
            volume snapshots. This means VAST CSI Snapshot Class will be used automatically 
            when volume snapshots are created without specifying a snapshot class. 
            See https://kubernetes.io/docs/concepts/storage/volume-snapshot-classes/#the-volumesnapshotclass-resource 
            for more details.
          type: boolean
          default: false
      type: object
  required:
    - secretName
    - secretNamespace
    - clusterName
    - driverType
    - storagePath
    - viewPolicy
    - subsystem
  type: object


.nfs-driver-dep: &nfs-driver-dep
  'urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:nfs'

.block-driver-dep: &block-driver-dep
  'urn:alm:descriptor:com.tectonic.ui:fieldDependency:driverType:block'


specDescriptors:
  - description: Choose the driver type for VastStorage.
    displayName: Driver Type
    path: driverType
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:select:nfs'
      - 'urn:alm:descriptor:com.tectonic.ui:select:block'
  - description: Choose Provisioner to create VastStorage for.
    displayName: Provisioner Name (NFS)
    path: nfsProvisioner
    x-descriptors:
      - *nfs-driver-dep
      - 'urn:alm:descriptor:io.kubernetes:storage.k8s.io:v1:CSIDriver?storage.vastdata.com/driverType=nfs'
  - description: Choose Provisioner to create VastStorage for.
    displayName: Provisioner Name (Block)
    path: blockProvisioner
    x-descriptors:
      - *block-driver-dep
      - 'urn:alm:descriptor:io.kubernetes:storage.k8s.io:v1:CSIDriver?storage.vastdata.com/driverType=block'
  - displayName: VastCluster Name
    path: clusterName
    description: >
      Name of the VastCluster to use.
      Leave empty if you are manually specifying a Secret.
    x-descriptors:
      - 'urn:alm:descriptor:io.kubernetes:storage.vastdata.com:v1:VastCluster'
  - displayName: Secret Name
    path: secretName
    description: >
      Name of the Secret with credentials.
      Used only if VastCluster is not specified.
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
  - displayName: Secret Namespace
    path: secretNamespace
    description: >
      Namespace of the Secret. Optional if using the operator’s namespace.
      Ignored if VastCluster is specified.
    x-descriptors:
      - 'urn:alm:descriptor:io.kubernetes:Namespace'
  - description: Base Storage Path for NFS views.
    displayName: Storage Path
    path: storagePath
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - *nfs-driver-dep
  - description: VAST policy name to create views.
    displayName: View Policy
    path: viewPolicy
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - *nfs-driver-dep
  - description: Name of QoS policy associates with the views or volumes.
    displayName: QoS Policy
    path: qosPolicy
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
  - description: >
      If true, the CSI driver will wait for the GSS (global snapshot stream) process to fully complete
      before returning from a volume clone operation. This ensures consistency at provisioning time but
      may increase latency. If false (default), the clone operation returns immediately after initiation.
    displayName: Blocking Clones
    path: blockingClones
    x-descriptors:
    - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
  - description: >
      Enables LUKS-based host encryption for block volumes.
      Requires a passphrase to be defined in the vast-mgmt Secret and may optionally include parameters
      such as cipher, key size, hash algorithm, and PBKDF memory cost.
    displayName: Host Encryption
    path: hostEncryption
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:fieldGroup:hostEncryption'
      - *block-driver-dep
  - description: >
      Encryption cipher used for LUKS. Must match supported kernel/cryptsetup values.
    displayName: Cipher
    path: hostEncryption.cipher
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:select:'
      - 'urn:alm:descriptor:com.tectonic.ui:select:aes-xts-plain64'
      - 'urn:alm:descriptor:com.tectonic.ui:select:aes-cbc-essiv:sha256'
      - 'urn:alm:descriptor:com.tectonic.ui:select:serpent-xts-plain64'
      - 'urn:alm:descriptor:com.tectonic.ui:select:twofish-cbc-essiv:sha256'
      - *block-driver-dep
  - description: >
      Key size in bits. Must be compatible with selected cipher.
      Common values: 256 (AES-128 XTS) or 512 (AES-256 XTS).
    displayName: Key Size
    path: hostEncryption.key_size
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:number'
      - *block-driver-dep
  - description: >
      Hash algorithm used for passphrase derivation in PBKDF.
    displayName: Hash Algorithm
    path: hostEncryption.hash
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:select:'
      - 'urn:alm:descriptor:com.tectonic.ui:select:sha1'
      - 'urn:alm:descriptor:com.tectonic.ui:select:sha256'
      - 'urn:alm:descriptor:com.tectonic.ui:select:sha512'
      - 'urn:alm:descriptor:com.tectonic.ui:select:ripemd160'
      - 'urn:alm:descriptor:com.tectonic.ui:select:whirlpool'
      - *block-driver-dep
  - description: >
      Memory cost for PBKDF in kilobytes. Applies only for memory-hard algorithms like argon2id.
    displayName: PBKDF Memory
    path: hostEncryption.pbkdf_memory
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:number'
      - *block-driver-dep


  - description: VAST subsystem for volume creation.
    displayName: Subsystem
    path: subsystem
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - *block-driver-dep
  - description: Tenant name - required for additional filtering when multiple subsystems share the same name.
    displayName: Tenant Name
    path: tenantName
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - *block-driver-dep
  - description: |-
      Optional template for constructing common volume prefix.
      It supports placeholders for the PVC name, namespace, and ID,
      which can be used in the format {namespace}, {name}, and {id}.
      If not provided, a default template will be used. The volume group
      can represent nested folder structures. For example:
         - "folder1/folder2/block-{namespace}-{id}
    displayName: Volume Group
    path: volumeGroup
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - *block-driver-dep
  - description: Filesystem type for volume creation.
    displayName: FsType
    path: fsType
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:select:'
      - 'urn:alm:descriptor:com.tectonic.ui:select:ext4'
      - 'urn:alm:descriptor:com.tectonic.ui:select:ext3'
      - 'urn:alm:descriptor:com.tectonic.ui:select:xfs'
      - *block-driver-dep
  - description: Host connectivity type used for block storage.
    displayName: Transport Type
    path: transportType
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
  - description: Allows resizing existing volumes.
    displayName: allowVolumeExpansion
    path: allowVolumeExpansion
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - description: |-
      Helps distribute load across the entire VIP pool by randomizing the VIP resolved for each volume mount.
      If set to true, a random prefix will be added to the VIP FQDN, ensuring that each NFS mount 
      request resolves to a different VIP from the VIP pool.
    displayName: vipPoolFQDNRandomPrefix
    path: vipPoolFQDNRandomPrefix
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - description: Create SnapshotClass for VastStorage.
    displayName: Create SnapshotClass
    path: createSnapshotClass
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
  - displayName: SnapshotClass configuration
    description: SnapshotClass options.
    path: snapshotClass
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:fieldDependency:createSnapshotClass:true'
  - displayName: ephemeralVolumeNameFormat
    description: String template for CSI-provisioned ephemeral volumes, within VAST.
    path: ephemeralVolumeNameFormat
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - displayName: volumeNameFormat
    description: String template for CSI-provisioned volume names, within VAST.
    path: volumeNameFormat
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:text'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - displayName: Reclaim Policy
    description: >-
      Reclaim policy defines what happens to the volume when the corresponding
      PersistentVolumeClaim (PVC) is deleted.
      See https://kubernetes.io/docs/concepts/storage/storage-classes/#reclaim-policy 
      for more details.
    path: reclaimPolicy
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:select:Delete'
      - 'urn:alm:descriptor:com.tectonic.ui:select:Retain'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - displayName: Set Default Storage Class
    description: >-
      When enabled, Vast CSI will be set as the default storage class for the entire 
      Kubernetes cluster. This means Vast CSI will automatically be chosen as the 
      storage class for persistent volume claims (PVCs) that do not specify a 
      storage class.
      See https://kubernetes.io/docs/concepts/storage/storage-classes/#default-storageclass 
      for more details.
    path: setDefaultStorageClass
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:booleanSwitch'
      - 'urn:alm:descriptor:com.tectonic.ui:advanced'
  - displayName: Transport Type
    description: Host connectivity type used for block storage.
    path: transportType
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'
      - *block-driver-dep
  - displayName: Provisioner Name
    description: Choose Provisioner to create VastStorage for.
    path: provisioner
    x-descriptors:
      - 'urn:alm:descriptor:com.tectonic.ui:hidden'

example:
  apiVersion: storage.vastdata.com/v1
  kind: VastStorage
  metadata:
    name: vastdata-filesystem
  spec:
    driverType: {{ .Values.driverType }}
    provisioner: ""
    clusterName: ""
    secretName: ""
    secretNamespace: ""
    storagePath: ""
    viewPolicy: ""
    vipPool: ""
    qosPolicy: ""
    subsystem: ""
    tenantName: ""
    volumeGroup: ""
    fsType: ""
    blockingClones: {{ .Values.blockingClones }}
    hostEncryption: {{ .Values.hostEncryption }}
    allowVolumeExpansion: {{ .Values.allowVolumeExpansion }}
    ephemeralVolumeNameFormat: {{ .Values.ephemeralVolumeNameFormat }}
    vipPoolFQDN: {{ .Values.vipPoolFQDN }}
    mountOptions: {{ .Values.mountOptions }}
    volumeNameFormat: {{ .Values.volumeNameFormat }}
    reclaimPolicy: {{ .Values.reclaimPolicy }}
    setDefaultStorageClass: {{ .Values.setDefaultStorageClass }}
    createSnapshotClass: {{ .Values.createSnapshotClass }}
    snapshotClass:
      snapshotNameFormat: {{ .Values.snapshotClass.snapshotNameFormat }}
      deletionPolicy: {{ .Values.snapshotClass.deletionPolicy }}
      setDefaultSnapshotClass: {{ .Values.snapshotClass.setDefaultSnapshotClass }}
