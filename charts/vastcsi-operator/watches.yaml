# Use the 'create api' subcommand to add watches to this file.
- group: storage.vastdata.com
  version: v1
  kind: VastCSIDriver
  chart: helm-charts/vastcsidriver
  overrideValues:
    image.csiVastPlugin.defaultRepository: $RELATED_IMAGE_CSI_DRIVER
    image.csiAttacher.defaultRepository: $RELATED_IMAGE_CSI_ATTACHER
    image.csiNodeDriverRegistrar.defaultRepository: $RELATED_IMAGE_CSI_NODE_DRIVER_REGISTRAR
    image.csiProvisioner.defaultRepository: $RELATED_IMAGE_CSI_PROVISIONER
    image.csiResizer.defaultRepository: $RELATED_IMAGE_CSI_RESIZER
    image.csiSnapshotter.defaultRepository: $RELATED_IMAGE_CSI_SNAPSHOTTER
    image.csiAddonsSidecar.defaultRepository: $RELATED_IMAGE_CSI_ADDONS_SIDECAR
- group: storage.vastdata.com
  version: v1
  kind: VastStorage
  chart: helm-charts/vaststorage
- group: storage.vastdata.com
  version: v1
  kind: VastCluster
  chart: helm-charts/vastcluster
- group: storage.vastdata.com
  version: v1
  kind: VastExtensionsManager
  chart: helm-charts/vastextensionsmanager
  overrideValues:
    image.vastExtensionController.defaultRepository: $RELATED_IMAGE_VAST_EXTENSION_CONTROLLER
    image.csiAddonsController.defaultRepository: $RELATED_IMAGE_CSI_ADDONS_CONTROLLER
# VastStorageClassReplication and VastVolumeReplication are reconciled by
# VastExtensionsManager (extensions-controller), not by the helm operator.
# They are declared in crd-charts for OpenShift UI / OLM CSV only.
# +kubebuilder:scaffold:watch
