####################
# COMMON
####################

driverType: "nfs" # Supported values: "nfs", "block"
# Reference to installed VastDriver CRD
driverName: ""
# Reference to installed VastCluster CRD
clusterName: ""

####################
# VAST CSI STORAGE CLASS OPTIONS (COMMON)
####################

# Name of VAST VIP pool to use - must be provided by user
vipPool: ""
# The FQDN of the VIP pool to use. Must specify either vipPool or vipPoolFQDN.
# Using a DNS skips an API call to the VMS for obtaining a random VIP from the vipPool, leading to faster volume mounting.
# NOTE: The driver will prepend the FQDN with a random prefix, which forces the NFS client to resolve into a different VIP,
# thereby distributing the load across the entire range of the VIP pool.
vipPoolFQDN: ""
# vipPoolFQDNRandomPrefix helps distribute load across the entire VIP pool by randomizing the VIP resolved for each volume mount.
# If set to true, a random prefix will be added to the VIP FQDN, ensuring that each NFS mount request resolves to a different VIP from the VIP pool.
vipPoolFQDNRandomPrefix: true
# Allows resizing existing volumes
allowVolumeExpansion: true
# If true, sets Vast CSI as the cluster-wide storage class default
setDefaultStorageClass: false
# String template for CSI-provisioned volume names, within VAST
volumeNameFormat: "csi:{namespace}:{name}:{id}"
# String template for CSI-provisioned ephemeral volumes, within VAST
ephemeralVolumeNameFormat: "csi:{namespace}:{name}:{id}"
# Add any extra NFS options desired here
mountOptions: []
# Reclaim policy to use with the storage class.
reclaimPolicy: "Delete"


####################
# VAST CSI STORAGE CLASS OPTIONS (NFS)
####################

# Where volumes will be located on VAST - must be provided by user
storagePath: ""
# VAST policy name to create views - must be provided by user
viewPolicy: ""
# Name of QoS policy associates with the view.
qosPolicy: ""

####################
# VAST CSI STORAGE CLASS OPTIONS (BLOCK)
####################

# Subsystem name - must be provided by user
subsystem: ""
# Tenant name – required for additional filtering when multiple subsystems share the same name.
tenantName: ""
# Optional template for constructing the volume group name.
# It supports placeholders for the PVC name, namespace, and ID,
# which can be used in the format {namespace}, {name}, and {id}.
# If not provided, a default template will be used. The volume group
# can represent nested folder structures. For example:
#   - "folder1/folder2/block-{namespace}-{id}
volumeGroup: ""
# Filesystem type to format the volume during creation.
# Allowed values:
#   - ext4: Ext4 filesystem
#   - ext3: Ext3 filesystem
#   - xfs: XFS filesystem
fsType: ""
# Host connectivity type used for block storage.
# Allowed values:
#   - TCP
#   - RDMA
# Default: TCP
transportType: "TCP"

####################
# VAST CSI SNAPSHOT CLASS OPTIONS
####################

createSnapshotClass: true

snapshotClass:
  # If true, sets SnapshotClass as the cluster-wide snapshot class default
  setDefaultSnapshotClass: false
  # String template for CSI-provisioned snapshot names, within VAST
  snapshotNameFormat: "csi:{namespace}:{name}:{id}"
  # On snapshot delete behavior. By default, Vast Cluster snapshot will be removed as well.
  deletionPolicy: "Delete"
