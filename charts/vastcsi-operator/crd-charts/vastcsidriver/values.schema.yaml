description: VastCSIDriver is a common specification for VAST CSI Controller and VAST CSI Node plugins, typically intended for creation in a single instance.


spec:
  description: Spec defines the desired state of VastCSIDriver
  type: object
  properties:
    # -- Controller -- start ->
    controller:
      type: object
      description: Controller configuration
      properties:
        podAffinity:
          description: Describes pod affinity scheduling rules (e.g. co-locate
            this pod in the same node, zone, etc. as some other pod(s)).
          properties:
            preferredDuringSchedulingIgnoredDuringExecution:
              description: The scheduler will prefer to schedule pods to
                nodes that satisfy the affinity expressions specified by
                this field, but it may choose a node that violates one or
                more of the expressions. The node that is most preferred
                is the one with the greatest sum of weights, i.e. for each
                node that meets all of the scheduling requirements (resource
                request, requiredDuringScheduling affinity expressions,
                etc.), compute a sum by iterating through the elements of
                this field and adding "weight" to the sum if the node has
                pods which matches the corresponding podAffinityTerm; the
                node(s) with the highest sum are the most preferred.
              items:
                description: The weights of all of the matched WeightedPodAffinityTerm
                  fields are added per-node to find the most preferred node(s)
                properties:
                  podAffinityTerm:
                    description: Required. A pod affinity term, associated
                      with the corresponding weight.
                    properties:
                      labelSelector:
                        description: A label query over a set of resources,
                          in this case pods.
                        properties:
                          matchExpressions:
                            description: matchExpressions is a list of label
                              selector requirements. The requirements are
                              ANDed.
                            items:
                              description: A label selector requirement
                                is a selector that contains values, a key,
                                and an operator that relates the key and
                                values.
                              properties:
                                key:
                                  description: key is the label key that
                                    the selector applies to.
                                  type: string
                                operator:
                                  description: operator represents a key's
                                    relationship to a set of values. Valid
                                    operators are In, NotIn, Exists and
                                    DoesNotExist.
                                  type: string
                                values:
                                  description: values is an array of string
                                    values. If the operator is In or NotIn,
                                    the values array must be non-empty.
                                    If the operator is Exists or DoesNotExist,
                                    the values array must be empty. This
                                    array is replaced during a strategic
                                    merge patch.
                                  items:
                                    type: string
                                  type: array
                              required:
                                - key
                                - operator
                              type: object
                            type: array
                          matchLabels:
                            additionalProperties:
                              type: string
                            description: matchLabels is a map of {key,value}
                              pairs. A single {key,value} in the matchLabels
                              map is equivalent to an element of matchExpressions,
                              whose key field is "key", the operator is
                              "In", and the values array contains only "value".
                              The requirements are ANDed.
                            type: object
                        type: object
                      namespaces:
                        description: namespaces specifies which namespaces
                          the labelSelector applies to (matches against);
                          null or empty list means "this pod's namespace"
                        items:
                          type: string
                        type: array
                      topologyKey:
                        description: This pod should be co-located (affinity)
                          or not co-located (anti-affinity) with the pods
                          matching the labelSelector in the specified namespaces,
                          where co-located is defined as running on a node
                          whose value of the label with key topologyKey
                          matches that of any node on which any of the selected
                          pods is running. Empty topologyKey is not allowed.
                        type: string
                    required:
                      - topologyKey
                    type: object
                  weight:
                    description: weight associated with matching the corresponding
                      podAffinityTerm, in the range 1-100.
                    format: int32
                    type: integer
                required:
                  - podAffinityTerm
                  - weight
                type: object
              type: array
            requiredDuringSchedulingIgnoredDuringExecution:
              description: If the affinity requirements specified by this
                field are not met at scheduling time, the pod will not be
                scheduled onto the node. If the affinity requirements specified
                by this field cease to be met at some point during pod execution
                (e.g. due to a pod label update), the system may or may
                not try to eventually evict the pod from its node. When
                there are multiple elements, the lists of nodes corresponding
                to each podAffinityTerm are intersected, i.e. all terms
                must be satisfied.
              items:
                description: Defines a set of pods (namely those matching
                  the labelSelector relative to the given namespace(s))
                  that this pod should be co-located (affinity) or not co-located
                  (anti-affinity) with, where co-located is defined as running
                  on a node whose value of the label with key <topologyKey>
                  matches that of any node on which a pod of the set of
                  pods is running
                properties:
                  labelSelector:
                    description: A label query over a set of resources,
                      in this case pods.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label
                          selector requirements. The requirements are ANDed.
                        items:
                          description: A label selector requirement is a
                            selector that contains values, a key, and an
                            operator that relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the
                                selector applies to.
                              type: string
                            operator:
                              description: operator represents a key's relationship
                                to a set of values. Valid operators are
                                In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: values is an array of string
                                values. If the operator is In or NotIn,
                                the values array must be non-empty. If the
                                operator is Exists or DoesNotExist, the
                                values array must be empty. This array is
                                replaced during a strategic merge patch.
                              items:
                                type: string
                              type: array
                          required:
                            - key
                            - operator
                          type: object
                        type: array
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: matchLabels is a map of {key,value}
                          pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions,
                          whose key field is "key", the operator is "In",
                          and the values array contains only "value". The
                          requirements are ANDed.
                        type: object
                    type: object
                  namespaces:
                    description: namespaces specifies which namespaces the
                      labelSelector applies to (matches against); null or
                      empty list means "this pod's namespace"
                    items:
                      type: string
                    type: array
                  topologyKey:
                    description: This pod should be co-located (affinity)
                      or not co-located (anti-affinity) with the pods matching
                      the labelSelector in the specified namespaces, where
                      co-located is defined as running on a node whose value
                      of the label with key topologyKey matches that of
                      any node on which any of the selected pods is running.
                      Empty topologyKey is not allowed.
                    type: string
                required:
                  - topologyKey
                type: object
              type: array
          type: object
        podAntiAffinity:
          description: Describes pod anti-affinity scheduling rules (e.g.
            avoid putting this pod in the same node, zone, etc. as some
            other pod(s)).
          properties:
            preferredDuringSchedulingIgnoredDuringExecution:
              description: The scheduler will prefer to schedule pods to
                nodes that satisfy the anti-affinity expressions specified
                by this field, but it may choose a node that violates one
                or more of the expressions. The node that is most preferred
                is the one with the greatest sum of weights, i.e. for each
                node that meets all of the scheduling requirements (resource
                request, requiredDuringScheduling anti-affinity expressions,
                etc.), compute a sum by iterating through the elements of
                this field and adding "weight" to the sum if the node has
                pods which matches the corresponding podAffinityTerm; the
                node(s) with the highest sum are the most preferred.
              items:
                description: The weights of all of the matched WeightedPodAffinityTerm
                  fields are added per-node to find the most preferred node(s)
                properties:
                  podAffinityTerm:
                    description: Required. A pod affinity term, associated
                      with the corresponding weight.
                    properties:
                      labelSelector:
                        description: A label query over a set of resources,
                          in this case pods.
                        properties:
                          matchExpressions:
                            description: matchExpressions is a list of label
                              selector requirements. The requirements are
                              ANDed.
                            items:
                              description: A label selector requirement
                                is a selector that contains values, a key,
                                and an operator that relates the key and
                                values.
                              properties:
                                key:
                                  description: key is the label key that
                                    the selector applies to.
                                  type: string
                                operator:
                                  description: operator represents a key's
                                    relationship to a set of values. Valid
                                    operators are In, NotIn, Exists and
                                    DoesNotExist.
                                  type: string
                                values:
                                  description: values is an array of string
                                    values. If the operator is In or NotIn,
                                    the values array must be non-empty.
                                    If the operator is Exists or DoesNotExist,
                                    the values array must be empty. This
                                    array is replaced during a strategic
                                    merge patch.
                                  items:
                                    type: string
                                  type: array
                              required:
                                - key
                                - operator
                              type: object
                            type: array
                          matchLabels:
                            additionalProperties:
                              type: string
                            description: matchLabels is a map of {key,value}
                              pairs. A single {key,value} in the matchLabels
                              map is equivalent to an element of matchExpressions,
                              whose key field is "key", the operator is
                              "In", and the values array contains only "value".
                              The requirements are ANDed.
                            type: object
                        type: object
                      namespaces:
                        description: namespaces specifies which namespaces
                          the labelSelector applies to (matches against);
                          null or empty list means "this pod's namespace"
                        items:
                          type: string
                        type: array
                      topologyKey:
                        description: This pod should be co-located (affinity)
                          or not co-located (anti-affinity) with the pods
                          matching the labelSelector in the specified namespaces,
                          where co-located is defined as running on a node
                          whose value of the label with key topologyKey
                          matches that of any node on which any of the selected
                          pods is running. Empty topologyKey is not allowed.
                        type: string
                    required:
                      - topologyKey
                    type: object
                  weight:
                    description: weight associated with matching the corresponding
                      podAffinityTerm, in the range 1-100.
                    format: int32
                    type: integer
                required:
                  - podAffinityTerm
                  - weight
                type: object
              type: array
            requiredDuringSchedulingIgnoredDuringExecution:
              description: If the anti-affinity requirements specified by
                this field are not met at scheduling time, the pod will
                not be scheduled onto the node. If the anti-affinity requirements
                specified by this field cease to be met at some point during
                pod execution (e.g. due to a pod label update), the system
                may or may not try to eventually evict the pod from its
                node. When there are multiple elements, the lists of nodes
                corresponding to each podAffinityTerm are intersected, i.e.
                all terms must be satisfied.
              items:
                description: Defines a set of pods (namely those matching
                  the labelSelector relative to the given namespace(s))
                  that this pod should be co-located (affinity) or not co-located
                  (anti-affinity) with, where co-located is defined as running
                  on a node whose value of the label with key <topologyKey>
                  matches that of any node on which a pod of the set of
                  pods is running
                properties:
                  labelSelector:
                    description: A label query over a set of resources,
                      in this case pods.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label
                          selector requirements. The requirements are ANDed.
                        items:
                          description: A label selector requirement is a
                            selector that contains values, a key, and an
                            operator that relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the
                                selector applies to.
                              type: string
                            operator:
                              description: operator represents a key's relationship
                                to a set of values. Valid operators are
                                In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: values is an array of string
                                values. If the operator is In or NotIn,
                                the values array must be non-empty. If the
                                operator is Exists or DoesNotExist, the
                                values array must be empty. This array is
                                replaced during a strategic merge patch.
                              items:
                                type: string
                              type: array
                          required:
                            - key
                            - operator
                          type: object
                        type: array
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: matchLabels is a map of {key,value}
                          pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions,
                          whose key field is "key", the operator is "In",
                          and the values array contains only "value". The
                          requirements are ANDed.
                        type: object
                    type: object
                  namespaces:
                    description: namespaces specifies which namespaces the
                      labelSelector applies to (matches against); null or
                      empty list means "this pod's namespace"
                    items:
                      type: string
                    type: array
                  topologyKey:
                    description: This pod should be co-located (affinity)
                      or not co-located (anti-affinity) with the pods matching
                      the labelSelector in the specified namespaces, where
                      co-located is defined as running on a node whose value
                      of the label with key topologyKey matches that of
                      any node on which any of the selected pods is running.
                      Empty topologyKey is not allowed.
                    type: string
                required:
                  - topologyKey
                type: object
              type: array
          type: object
        nodeAffinity:
          description: Describes node affinity scheduling rules for the pod.
          properties:
            preferredDuringSchedulingIgnoredDuringExecution:
              description: The scheduler will prefer to schedule pods to
                nodes that satisfy the affinity expressions specified by
                this field, but it may choose a node that violates one or
                more of the expressions. The node that is most preferred
                is the one with the greatest sum of weights, i.e. for each
                node that meets all of the scheduling requirements (resource
                request, requiredDuringScheduling affinity expressions,
                etc.), compute a sum by iterating through the elements of
                this field and adding "weight" to the sum if the node matches
                the corresponding matchExpressions; the node(s) with the
                highest sum are the most preferred.
              items:
                description: An empty preferred scheduling term matches
                  all objects with implicit weight 0 (i.e. it's a no-op).
                  A null preferred scheduling term matches no objects (i.e.
                  is also a no-op).
                properties:
                  preference:
                    description: A node selector term, associated with the
                      corresponding weight.
                    properties:
                      matchExpressions:
                        description: A list of node selector requirements
                          by node's labels.
                        items:
                          description: A node selector requirement is a
                            selector that contains values, a key, and an
                            operator that relates the key and values.
                          properties:
                            key:
                              description: The label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: Represents a key's relationship
                                to a set of values. Valid operators are
                                In, NotIn, Exists, DoesNotExist. Gt, and
                                Lt.
                              type: string
                            values:
                              description: An array of string values. If
                                the operator is In or NotIn, the values
                                array must be non-empty. If the operator
                                is Exists or DoesNotExist, the values array
                                must be empty. If the operator is Gt or
                                Lt, the values array must have a single
                                element, which will be interpreted as an
                                integer. This array is replaced during a
                                strategic merge patch.
                              items:
                                type: string
                              type: array
                          required:
                            - key
                            - operator
                          type: object
                        type: array
                      matchFields:
                        description: A list of node selector requirements
                          by node's fields.
                        items:
                          description: A node selector requirement is a
                            selector that contains values, a key, and an
                            operator that relates the key and values.
                          properties:
                            key:
                              description: The label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: Represents a key's relationship
                                to a set of values. Valid operators are
                                In, NotIn, Exists, DoesNotExist. Gt, and
                                Lt.
                              type: string
                            values:
                              description: An array of string values. If
                                the operator is In or NotIn, the values
                                array must be non-empty. If the operator
                                is Exists or DoesNotExist, the values array
                                must be empty. If the operator is Gt or
                                Lt, the values array must have a single
                                element, which will be interpreted as an
                                integer. This array is replaced during a
                                strategic merge patch.
                              items:
                                type: string
                              type: array
                          required:
                            - key
                            - operator
                          type: object
                        type: array
                    type: object
                  weight:
                    description: Weight associated with matching the corresponding
                      nodeSelectorTerm, in the range 1-100.
                    format: int32
                    type: integer
                required:
                  - preference
                  - weight
                type: object
              type: array
            requiredDuringSchedulingIgnoredDuringExecution:
              description: If the affinity requirements specified by this
                field are not met at scheduling time, the pod will not be
                scheduled onto the node. If the affinity requirements specified
                by this field cease to be met at some point during pod execution
                (e.g. due to an update), the system may or may not try to
                eventually evict the pod from its node.
              properties:
                nodeSelectorTerms:
                  description: Required. A list of node selector terms.
                    The terms are ORed.
                  items:
                    description: A null or empty node selector term matches
                      no objects. The requirements of them are ANDed. The
                      TopologySelectorTerm type implements a subset of the
                      NodeSelectorTerm.
                    properties:
                      matchExpressions:
                        description: A list of node selector requirements
                          by node's labels.
                        items:
                          description: A node selector requirement is a
                            selector that contains values, a key, and an
                            operator that relates the key and values.
                          properties:
                            key:
                              description: The label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: Represents a key's relationship
                                to a set of values. Valid operators are
                                In, NotIn, Exists, DoesNotExist. Gt, and
                                Lt.
                              type: string
                            values:
                              description: An array of string values. If
                                the operator is In or NotIn, the values
                                array must be non-empty. If the operator
                                is Exists or DoesNotExist, the values array
                                must be empty. If the operator is Gt or
                                Lt, the values array must have a single
                                element, which will be interpreted as an
                                integer. This array is replaced during a
                                strategic merge patch.
                              items:
                                type: string
                              type: array
                          required:
                            - key
                            - operator
                          type: object
                        type: array
                      matchFields:
                        description: A list of node selector requirements
                          by node's fields.
                        items:
                          description: A node selector requirement is a
                            selector that contains values, a key, and an
                            operator that relates the key and values.
                          properties:
                            key:
                              description: The label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: Represents a key's relationship
                                to a set of values. Valid operators are
                                In, NotIn, Exists, DoesNotExist. Gt, and
                                Lt.
                              type: string
                            values:
                              description: An array of string values. If
                                the operator is In or NotIn, the values
                                array must be non-empty. If the operator
                                is Exists or DoesNotExist, the values array
                                must be empty. If the operator is Gt or
                                Lt, the values array must have a single
                                element, which will be interpreted as an
                                integer. This array is replaced during a
                                strategic merge patch.
                              items:
                                type: string
                              type: array
                          required:
                            - key
                            - operator
                          type: object
                        type: array
                    type: object
                  type: array
              required:
                - nodeSelectorTerms
              type: object
          type: object
        dnsPolicy:
          type: string
          default: {{ .Values.controller.dnsPolicy }}
          description: DNSPolicy defines how a pod's DNS will be configured.
          enum:
            - Default
            - ClusterFirstWithHostNet
            - ClusterFirst
        nodeSelector:
          additionalProperties:
            type: string
          description: NodeSelector specifies a map of key-value pairs. For
            the pod to be eligible to run on a node, the node must have each
            of the indicated key-value pairs as labels.
          type: object
        resources:
          type: object
          description: Resource limits and requests for controller components
          properties:
            csiAttacher:
              type: object
              properties:
                limits: &limits
                  additionalProperties:
                    anyOf:
                      - type: integer
                      - type: string
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  description: |-
                    Limits describes the maximum amount of compute resources allowed.
                    More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                  type: object
                requests: &requests
                  additionalProperties:
                    anyOf:
                      - type: integer
                      - type: string
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  description: |-
                    Requests describes the minimum amount of compute resources required.
                    If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                    otherwise to an implementation-defined value. Requests cannot exceed Limits.
                    More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                  type: object
            csiProvisioner:
              type: object
              properties:
                limits:
                  <<: *limits
                requests:
                  <<: *requests
            csiResizer:
              type: object
              properties:
                limits:
                  <<: *limits
                requests:
                  <<: *requests
            csiSnapshotter:
              type: object
              properties:
                limits:
                 <<: *limits
                requests:
                  <<: *requests
            csiVastPlugin:
              type: object
              properties:
                limits:
                  <<: *limits
                requests:
                  <<: *requests
        extraArgs:
          type: object
          properties:
            csiAttacher:
              type: array
              items:
                type: string
              description: |
                Additional arguments for csiAttacher.
                For further options, check
                https://github.com/kubernetes-csi/external-attacher#command-line-options
            csiProvisioner:
              type: array
              items:
                type: string
              description: |
                Additional arguments for csiProvisioner.
                For further options, check
                https://github.com/kubernetes-csi/external-provisioner#command-line-options
            csiResizer:
              type: array
              items:
                type: string
              description: |
                Additional arguments for csiResizer.
                For further options, check
                https://github.com/kubernetes-csi/external-resizer#recommended-optional-arguments
            csiSnapshotter:
              type: array
              items:
                type: string
              description: |
                Additional arguments for csiSnapshotter.
                For further options, check
                https://github.com/kubernetes-csi/external-snapshotter#csi-external-snapshotter-sidecar-command-line-options
        runOnControlPlane:
          type: boolean
          description: Whether to run on the control plane
          default: {{ .Values.controller.runOnControlPlane }}
        runOnMaster:
          type: boolean
          description: Whether to run on the master node
          default: {{ .Values.controller.runOnMaster }}
        tolerations:
          type: array
          default: {{ .Values.controller.tolerations }}
          description: Tolerations for all the pods deployed by the VASTData CSI Controller.
            The pod with this toleration attached will tolerate any taint that matches the
            triple <key,value,effect> using the matching operator <operator>.
          items:
            type: object
            properties:
              effect:
                type: string
                description: Effect indicates the taint effect to match. Empty means match
                  all taint effects. When specified, allowed values are NoSchedule,
                  PreferNoSchedule and NoExecute.
              key:
                type: string
                description: Key is the taint key that the toleration applies to. Empty means
                  match all taint keys. If the key is empty, operator must be Exists; this
                  combination means to match all values and all keys.
              operator:
                type: string
                description: Operator represents a key's relationship to the value. Valid
                  operators are Exists and Equal. Defaults to Equal. Exists is equivalent to
                  wildcard for value, so that a pod can tolerate all taints of a particular category.
              value:
                type: string
                description: Value is the taint value the toleration matches to. If the operator
                  is Exists, the value should be empty, otherwise just a regular string.
              tolerationSeconds:
                type: integer
                description: TolerationSeconds represents the period of time the toleration
                  (which must be of effect NoExecute, otherwise this field is ignored) tolerates
                  the taint. By default, it is not set, which means tolerate the taint forever
                  (do not evict). Zero and negative values will be treated as 0 (evict
                  immediately) by the system.
        metrics:
          type: object
          description: Metrics configuration for CSI controller
          properties:
            enabled:
              type: boolean
              description: Enable Prometheus metrics endpoint
              default: {{ .Values.controller.metrics.enabled }}
            port:
              type: integer
              format: int32
              description: Port for metrics HTTP server
              default: {{ .Values.controller.metrics.port }}
            serviceMonitor:
              type: object
              description: ServiceMonitor configuration (Prometheus Operator CRD)
              properties:
                enabled:
                  type: boolean
                  description: Enable ServiceMonitor creation (requires Prometheus Operator)
                  default: {{ .Values.controller.metrics.serviceMonitor.enabled }}
                interval:
                  type: string
                  description: Scrape interval
                  default: {{ .Values.controller.metrics.serviceMonitor.interval }}
                labels:
                  type: array
                  description: Additional labels to add to the ServiceMonitor resource (each entry is a key/value pair)
                  default: []
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Label key
                      value:
                        type: string
                        description: Label value
                relabelings:
                  type: array
                  description: Relabelings to apply to samples before ingestion
                  items:
                    type: object
                    properties:
                      action:
                        type: string
                        description: >-
                          Action to perform based on the regex matching.
                          Uppercase and Lowercase require Prometheus >= v2.36.0.
                          DropEqual and KeepEqual require Prometheus >= v2.41.0.
                          Default: Replace
                        default: replace
                        enum:
