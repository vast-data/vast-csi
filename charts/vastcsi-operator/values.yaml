name: "csi.vastdata.com"

# Namespace for csi driver operator installation.
# If a namespace is not specified during the installation of the CSI driver operator,
# it will default to the namespace of the Helm release.
namespace: null

# CI pipe for testing builds
ciPipe: null

# imagePullSecret for testing builds
imagePullSecret: null

# Operator manager image
managerImage: docker.io/vastdataorg/csi@sha256:7cd73d9cc3e35ef74ac0efd1e7d4c8a88100c8c259acbbaf9e548dc13e645139
# Operator proxy image
proxyImage: docker.io/kubebuilder/kube-rbac-proxy@sha256:a2523c532c0c3d51a5396a901d7ded23e402a9a1492c783aae27af6d0c1d2ec5

# Used in OpenShift UI for driver installation.
suggestedNamespace: "vast-csi"

# Operator documentation link
operatorDocs: "https://support.vastdata.com/s/document-item?bundleId=vast-csi-driver-2.6-administrator-s-guide&topicId=deploying-vast-csi-driver/deploying-vast-csi-driver-on-openshift-with-vast-csi-operator.html&_LANG=enus"

