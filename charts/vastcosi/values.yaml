####################
# VAST REST SESSION ATTRIBUTES
####################
# Secret name, which corresponds to a secret containing credentials to login - must be provided by user
# The secret can use either username and password fields or an API token for authentication.
# Example:
#     kubectl create secret generic vast-mgmt \
#     --from-literal=username=< VAST username > \
#     --from-literal=password=< VAST password > \
#     --from-literal=endpoint=< VAST endpoint >
# Or create secret with Api-Token based authentication:
#     kubectl create secret generic vast-mgmt \
#     --from-literal=token=< API token > \
#     --from-literal=endpoint=< VAST endpoint >
# Optionally, you can include:
# - ssl_cert: SSL certificate for secure communication
# - tenant: Set only for tenant-admin username/password (driver sends X-Tenant-Name).
#   Omit for cluster-admin (user/pass or Api-Token). Always omit with Api-Token
#   (Api-Token + tenant can make VMS return HTTP 400).
secretName: ""

# API endpoint of VAST appliance - must be provided by user
endpoint: ""

# Set true to enable certificate validity test
verifySsl: false

# Path (absolute or relative) to SSL certificate for verifying the VAST REST API.
# Must be set using `set-file` option eg `--set-file sslCert=< path to sslCert.crt >`
# sslCertsSecretName secret and sslCert option in values.yaml are mutually exclusive. Make sure to use only one of them.
sslCert: ""
# Secret name, which corresponds to a secret containing an SSL certificate for verifying the VAST REST API
# Example: kubectl create secret generic vast-tls --from-file=ca-bundle.crt=< path to sslCert.crt >
# sslCertsSecretName secret and sslCert option in values.yaml are mutually exclusive. Make sure to use only one of them.
sslCertsSecretName: ""

####################
# VAST COSI BUCKET CLASS OPTIONS
####################

bucketClassDefaults:
  # Where buckets will be located on VAST - must be provided by user
  storagePath: ""
  # Name of VAST VIP pool to use. Must specify either vipPool or vipPoolFQDN.
  vipPool: ""
  # The FQDN of the VIP pool to use. Must specify either vipPool or vipPoolFQDN.
  vipPoolFQDN: ""
  # When true, prepend a random prefix to vipPoolFQDN for per-bucket VIP distribution.
  vipPoolFQDNRandomPrefix: true
  # Per-BucketClass VMS auth secret (may be tenant-admin or cluster-admin).
  # Differs from chart-level secretName only in that this one is scoped per BucketClass.
  # secretNamespace defaults to the Helm release namespace when secretName is set.
  secretName: ""
  secretNamespace: ""
  # Name of S3 policy to create bucket - must be provided by user
  viewPolicy: ""
  # On bucket delete behavior. By default, Vast Cluster bucket will be removed.
  deletionPolicy: "Delete"
  # Scheme utilized for creating bucket endpoint. Must be one of: http, https
  scheme: "http"
  # Optional bucket size limit (Kubernetes quantity, e.g. 30Gi). Omit for no quota.
  maxSize: ""

bucketClasses: {}
# bucketClasses:
#   BucketClass name. Must be unique and at most 63-36=27 characters (COSI appends a
#   36-char BucketClaim UID; S3/VAST bucket names are limited to 63 characters).
#   vastdata-bucket:
#     vipPool: vippool-1
#     vipPoolFQDN: s3.example.com
#     secretName: team-a-vast-auth
#     secretNamespace: app-team
#     # Optional: VMS S3 lifecycle rules applied at bucket create.
#     # One rule per list element on the bucket's view; removed on bucket delete.
#     # Rules apply at create only (BucketClass is immutable).
#     # Rule names must be unique. Unknown keys are rejected.
#     lifecycleRules:
#       - name: expire-logs
#         expiration_days: 30
#         prefix: logs/
#       - name: expire-tmp
#         expiration_days: 7
#         prefix: tmp/
#         abort_mpu_days_after_initiation: 1
#     viewPolicy: s3_policy
#
#   # Optional: existing VMS/AD user as S3 bucket owner (Helm camelCase only →
#   # BucketClass parameters bucket_owner / bucket_owner_context). Do not put
#   # snake_case keys in values — chart fails. Set both or omit both; omit both
#   # = managed mode (driver creates a local user named after the bucket).
#   vastdata-bucket-ad-owned:
#     storagePath: /cosi
#     viewPolicy: s3_default_policy
#     vipPool: vippool-1
#     bucketOwner: corp-s3-service-account@corp.local
#     bucketOwnerContext: AD   # required with bucketOwner; use local on lab without AD
#
# Grant notes (BucketAccessClass parameters — see examples/cosi/):
#   - VMS enforces a 2 access-key limit per user per tenant; shared service
#     accounts cannot rely on generate for many BucketAccess objects.
#   - credentialsSecretName + credentialsSecretNamespace install keys from a
#     K8s Secret onto local owners only (POST /users/{id}/access_keys/).
#     External LDAP/AD owners must use generated keys (non_local_keys API)
#     until VMS adds external-key install on non_local_keys.

bucketAccessClasses: {}

####################
# COSI PLUGIN RUNTIME PARAMETERS
####################

# The number of worker threads the COSI plugin use to serve requests simultaneously.
numWorkers: 10

# Disable sending usage statistics to VAST cluster.
# When set to true, the COSI driver will not report plugin usage metrics to VMS.
disableUsageStats: false

# Cache-Control max-age header value in seconds for VMS API requests.
# When set to a value greater than 0, the COSI driver will add a Cache-Control header
# to VMS API requests, allowing intermediate caches (like Nginx) to cache responses.
# This is useful for handling burst traffic patterns and reducing load on the VMS.
# Set to 0 to disable caching (default).
cacheMaxAgeSeconds: 0

# The name of the COSI driver registered with Kubernetes.
# This value is used to identify the driver in COSI objects like BucketClasses etc.
cosiDriverName: csi.vastdata.com

####################
# VAST COSI PLUGIN OPTIONS
####################

image:
  csiVastPlugin:
    repository: vastdataorg/csi
    tag: v2.7.0  # the version of the Vast COSI driver
    imagePullPolicy: IfNotPresent
  objectstorageProvisioner:
    repository: gcr.io/k8s-staging-sig-storage/objectstorage-sidecar/objectstorage-sidecar
    tag: v20230130-v0.1.0-24-gc0cf995
    imagePullPolicy: IfNotPresent
  # Extensions-controller image (COSI credentials flattener and other K8s-native addons).
  vastExtensionController:
    repository: '{{ .Values.image.csiVastPlugin.repository }}'
    tag: '{{ .Values.image.csiVastPlugin.tag }}-extensions'
    imagePullPolicy: IfNotPresent

####################
# EXTENSIONS (always-on with the COSI driver)
####################
extensions:
  # Human-readable console logging (colored levels, caller, ISO-8601 timestamps).
  devLogging: true
  # Bucket-params mutating webhook + TLS (merges cosi.vastdata.com/* claim annotations).
  # Helm generates a self-signed serving cert (no cert-manager path yet).
  webhook:
    port: 9443
    failurePolicy: Fail
  # Credentials flattener metrics bind (pod-local). Use "0" to disable.
  metricsBindAddress: "0"

####################
# VAST COSI PLUGIN BEHAVIOR
#
# WARNING - these parameters are for advanced users.
# Setting these incorrectly may prevent the VAST COSI Driver from running correctly.
#  We recommend to consult with VAST Support before changing any of the following parameters
####################

cosiplugin:
  # determine how DNS (Domain Name System) resolution should be handled within Pod.
  # available values: Default, ClusterFirstWithHostNet, ClusterFirst
  dnsPolicy: Default
  # nodeSelector is the way to restrict pod to be assigned on certain node/nodes.
  # Specify node selector if you want node and controller containers to be assigned only to specific node/nodes of
  # your cluster.
  #  https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector.
  nodeSelector: {}
  # If specified, the pod's tolerations
  # https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  tolerations: []
  # If specified, the pod's scheduling constraints
  # https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  affinity: {}
  # Resources describes the compute resource requirements.
  resources:
    objectstorageProvisioner:
      limits:
        memory: 200Mi
      requests:
        cpu: 10m
        memory: 20Mi
    cosiVastPlugin:
      limits:
        memory: 500Mi
      requests:
        cpu: 100m
        memory: 50Mi
    extensionsManager:
      limits:
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 64Mi
  # priorityClassName is the name of priority class to be used for the pod.
  priorityClassName: system-node-critical

# Reference to one or more secrets to be used when pulling images
# ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
# - name: "image-pull-secret"
imagePullSecrets: []

