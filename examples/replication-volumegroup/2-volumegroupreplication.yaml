# VolumeGroupReplication - Groups PVCs together for consistent replication
# All PVCs matching the label selector will be replicated as a group
---
apiVersion: replication.storage.openshift.io/v1alpha1
kind: VolumeGroupReplication
metadata:
  name: myapp-volume-group
  namespace: default
spec:
  volumeGroupReplicationClassName: vastdata-filesystem-repl
  volumeReplicationClassName: vastdata-filesystem-repl
  replicationState: secondary
  
  source:
    selector:
      matchLabels:
        appname: myapp
  
  autoResync: false

