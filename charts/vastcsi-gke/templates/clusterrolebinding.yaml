{{- if .Values.rbac }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-vast-attacher-binding
  labels:
    {{- include "vast.common.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-vast-controller-sa
    namespace: {{ include "vast.common.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-vast-attacher-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-vast-snapshotter-binding
  labels:
    {{- include "vast.common.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-vast-controller-sa
    namespace: {{ include "vast.common.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-vast-snapshotter-role
  apiGroup: rbac.authorization.k8s.io
---
{{- end -}}
