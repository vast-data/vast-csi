{{- if include "vastcsi.addons-enabled" . -}}

{{- $csi_images := .Values.image -}}
{{- $driver_name := include "vastcsi.csiDriver" . -}}
{{- $csi_sock := printf "addons.%s.sock" ($driver_name | lower | replace "." "-" | replace "_" "-" | trimSuffix "-" | trimPrefix "-") -}}
{{- $plugin_proxy_sock := printf "/var/lib/csi/sockets/pluginproxy/%s" $csi_sock -}}
{{- $plugin_proxy_sock_path := "/var/lib/csi/sockets/pluginproxy/" -}}
{{- $ca_bundle := empty .Values.sslCert | ternary .Values.sslCertsSecretName "csi-vast-ca-bundle" -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vast-addons-controller
  namespace: {{ include "vastcsi.namespace" . }}
  labels:
{{- include "vastcsi.labels" . | nindent 4 }}
    app: csi-vast-addons-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: csi-vast-addons-controller
  template:
    metadata:
      labels:
        app: csi-vast-addons-controller
{{- include "vastcsi.selectorLabels" . | nindent 8 }}
    spec:
{{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      {{- end }}
      affinity:
        podAffinity:
          {{- toYaml .Values.addonsController.podAffinity | nindent 10 }}
        podAntiAffinity:
          {{- toYaml .Values.addonsController.podAntiAffinity | nindent 10 }}
        nodeAffinity:
          {{- toYaml .Values.addonsController.nodeAffinity | nindent 10 }}
      containers:
        - name: csi-addons
          image: {{ printf "%s:%s" $csi_images.csiAddonsSidecar.repository (toString $csi_images.csiAddonsSidecar.tag) }}
          args:
            - "--node-id=$(NODE_ID)"
            - "--csi-addons-address={{ $plugin_proxy_sock }}"
            - "--controller-port=9070"
            - "--pod=$(POD_NAME)"
            - "--namespace=$(POD_NAMESPACE)"
            - "--pod-uid=$(POD_UID)"
            - "--stagingpath={{ .Values.kubeletPath }}/plugins/kubernetes.io/csi/"
            - "--v={{ .Values.logLevel | default 5 }}"
            - "--timeout={{ .Values.addonsOperationTimeout | default 120 }}s"
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          imagePullPolicy: {{ $csi_images.csiAddonsSidecar.imagePullPolicy | default  "IfNotPresent" }}
          ports:
            - containerPort: 9070
              name: csi-addons
              protocol: TCP
          volumeMounts:
            - name: socket-dir
              mountPath: {{ $plugin_proxy_sock_path }}
          resources: {{- toYaml .Values.addonsController.resources.csiAddonsSidecar | nindent 12 }}
        - name: csi-vast-plugin
          image: {{ printf "%s:%s" $csi_images.csiVastPlugin.repository (toString $csi_images.csiVastPlugin.tag) }}
          args:
            - "serve"
            - "--addons={{ include "vastcsi.addons-list" (dict "root" . "type" "nfs") }}"
          env:
{{- include "vastcsi.commonEnv" (dict "root" . "timeout" .Values.addonsOperationTimeout) | indent 12 }}
            - name: CSI_ENDPOINT
              value: unix://{{ $plugin_proxy_sock }}
            - name: X_CSI_MODE
              value: controller
          volumeMounts:
            - name: socket-dir
              mountPath: {{ $plugin_proxy_sock_path }}
{{- include "vastcsi.vmsAuthVolumeMount" (merge (dict "ca_bundle" $ca_bundle) .) | indent 12 }}
          resources: {{- toYaml .Values.addonsController.resources.csiVastPlugin | nindent 12 }}
      hostNetwork: true
      dnsPolicy: {{ .Values.addonsController.dnsPolicy }}
      nodeSelector:
{{- if .Values.addonsController.runOnMaster}}
        node-role.kubernetes.io/master: ""
        {{- end }}
{{- if .Values.addonsController.runOnControlPlane }}
        node-role.kubernetes.io/control-plane: ""
        {{- end }}
{{- if .Values.addonsController.nodeSelector }}
{{ toYaml .Values.addonsController.nodeSelector | indent 8 }}
      {{- end }}
      priorityClassName: {{ .Values.addonsController.priorityClassName }}
      serviceAccountName: {{ .Release.Name }}-vast-controller-sa
      tolerations:
{{ toYaml .Values.addonsController.tolerations | indent 8 }}
      volumes:
        - name: socket-dir
          emptyDir: {}
{{- include "vastcsi.vmsAuthVolume" (merge (dict "ca_bundle" $ca_bundle) .) | indent 8 }}

{{- end }}


