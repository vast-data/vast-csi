[tool.poetry]
name = "vast-data-csi-driver"
version = "2.5.0"
description = "VAST CSI Driver allows container orchestration frameworks such as Kubernetes to dynamically provision storage volumes on a VAST cluster."
authors = ["Ofer Koren <ofer.koren@vastdata.com>", "Volodymyr Boiko <volodymyr.boiko@vastdata.com>"]
license = "Apache-2.0"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
grpcio = "1.68.1"
grpcio-tools = "1.68.1"
ipython = "8.18.1"
ipython-genutils = "0.2.0"
prompt_toolkit = "3.0.48"
jedi = "0.19.1"
parso = "0.8.4"
pexpect = "4.9.0"
pickleshare = "0.7.5"
plumbum = "1.8.3"
protobuf = "5.29.5"
ptyprocess = "0.7.0"
Pygments = "2.18.0"
six = "1.16.0"
traitlets = "5.14.3"
wcwidth = "0.2.13"
real-easypy = "0.5.0"
psutil = "6.1.1"
requests = "2.32.5"
urllib3 = "^2.5.0"
cryptography = "44.0.1"
pyyaml = "6.0.2"
pytest = "7.2.0"
setuptools = "78.1.1"
dogpile-cache = ">=1.3,<1.5"
cachetools = "^6.2.4"
prometheus-client = "^0.21.0"

[build-system]
requires = ["poetry-core>=1.2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "6.0"
python_files = ["test_*.py", "*_test.py", "utest_*.py"]
