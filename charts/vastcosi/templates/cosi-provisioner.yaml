{{- $csi_images := .Values.image -}}
{{- $wh := .Values.extensions.webhook -}}
{{- $ext := .Values.extensions -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosi-vast-provisioner
  labels:
    app.kubernetes.io/csi-role: "cosi-provisioner"
{{- include "vast.common.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cosi-provisioner
{{- include "vast.common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: cosi-provisioner
{{- include "vast.common.labels" . | nindent 8 }}
    spec:
{{- include "vast.common.imagePullSecrets" (dict "secrets" .Values.imagePullSecrets) | nindent 6 }}
      affinity:
{{ toYaml .Values.cosiplugin.affinity | indent 8 }}
      serviceAccountName: {{ .Release.Name }}-objectstorage-provisioner-sa
      containers:
      - name: cosi-vast-plugin
        image: {{ include "vast.common.image" (dict "root" $ "image" $csi_images.csiVastPlugin) }}
        args: ["serve", "--plugin", "cosi"]
        imagePullPolicy: {{ $csi_images.csiVastPlugin.imagePullPolicy | default  "IfNotPresent" }}
        env:
{{- include "vastcosicommonEnv" . | indent 10 }}
          - name: CSI_ENDPOINT
            value: unix:///var/lib/cosi/cosi.sock
          - name: X_CSI_EXTENSIONS_GRPC_ADDRESS
            value: unix:///var/run/vast-extensions/extensions.sock
        volumeMounts:
{{- include "vast.common.vmsAuth.volumeMounts" . | indent 10 }}
          - mountPath: /var/lib/cosi
            name: socket-dir
          - name: extensions-dir
            mountPath: /var/run/vast-extensions
        resources: {{- toYaml .Values.cosiplugin.resources.cosiVastPlugin | nindent 10 }}
      - name: objectstorage-provisioner
        image: {{ include "vast.common.image" (dict "root" $ "image" $csi_images.objectstorageProvisioner) }}
        imagePullPolicy: {{ $csi_images.objectstorageProvisioner.imagePullPolicy | default  "IfNotPresent" }}
        args:
{{- include "vast.common.csi.verbosityArg" . | nindent 8 }}
        volumeMounts:
        - mountPath: /var/lib/cosi
          name: socket-dir
        resources: {{- toYaml .Values.cosiplugin.resources.objectstorageProvisioner | nindent 10 }}
      - name: extensions-manager
        image: {{ include "vast.common.image" (dict "root" $ "image" $csi_images.vastExtensionController) }}
        imagePullPolicy: {{ $csi_images.vastExtensionController.imagePullPolicy | default "IfNotPresent" }}
        args:
        - --health-probe-bind-address=:8081
        - --metrics-bind-address={{ $ext.metricsBindAddress | default "0" }}
{{- if $ext.devLogging }}
        # =true required: bare --dev-logging makes namespace argv splitter swallow the next token.
        - --dev-logging=true
{{- end }}
        - server
        - --extensions-grpc-bind-address=/var/run/vast-extensions/extensions.sock
        - webhook
        - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
        - --csi-driver-name={{ include "vast.common.csi.driverName" . }}
        - cosi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        ports:
        - name: webhook-server
          containerPort: {{ $wh.port | default 9443 }}
          protocol: TCP
        - name: mgr-health
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: mgr-health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: mgr-health
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: webhook-tls
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
        - name: extensions-dir
          mountPath: /var/run/vast-extensions
        resources: {{- toYaml .Values.cosiplugin.resources.extensionsManager | nindent 10 }}
      dnsPolicy: {{ .Values.cosiplugin.dnsPolicy }}
      nodeSelector:
{{ toYaml .Values.cosiplugin.nodeSelector | indent 8 }}
      priorityClassName: {{ .Values.cosiplugin.priorityClassName }}
      tolerations:
{{ toYaml .Values.cosiplugin.tolerations | indent 8 }}
      volumes:
        - name: socket-dir
          emptyDir: {}
        - name: extensions-dir
          emptyDir: {}
        - name: webhook-tls
          secret:
            secretName: {{ .Release.Name }}-cosi-extensions-webhook-tls
{{- include "vast.common.vmsAuth.volumes" . | indent 8 }}
