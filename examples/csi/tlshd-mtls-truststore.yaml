# Prerequisite: stop and disable host tlshd on every worker that runs the CSI
# node DaemonSet (systemctl stop tlshd && systemctl disable tlshd). Do not leave
# a mixed cluster (some nodes with host tlshd still active). The kernel TLS
# handshake agent is node-global; a host tlshd would win over the sidecar and
# ignore this ConfigMap/Secret. Then helm-upgrade with node.nfsServices.tlshd set.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vast-nfs-tlshd
  namespace: vast-csi
data:
  tlshd.conf: |
    [authenticate]
    keyrings=vastcsi

    [authenticate.client]
    x509.truststore=/etc/vast-tlshd/nfs-server-ca.pem

---
apiVersion: v1
kind: Secret
metadata:
  name: vast-nfs-tlshd-certs
  namespace: vast-csi
type: Opaque
stringData:
  nfs-server-ca.pem: |
    -----BEGIN CERTIFICATE-----
    # Replace with tenant NFS server CA PEM
    -----END CERTIFICATE-----
