# Test manifests for verifying PVC label injection webhook
#
# 1. A fake StorageClass with "subsystem" and "volume_group" parameters
# 2. A PVC using that StorageClass (should get labels injected)
# 3. A PVC using the default StorageClass (should NOT get labels)
#
# Usage:
#   kubectl apply -f hack/test-webhook.yaml
#   kubectl get pvc test-pvc --show-labels
#   kubectl get pvc test-pvc-no-labels --show-labels
#   kubectl delete -f hack/test-webhook.yaml
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: vast-block-test
provisioner: block.csi.vastdata.com
parameters:
  subsystem: "my-subsystem"
  volume_group: "my-volume-group"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: vast-block-test

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc-no-labels
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
