{{- $wh := .Values.webhook -}}
{{- $repWh := .Values.replication.webhooks -}}
{{- $filterConfig := $repWh.pvcLabels.filterConfig -}}
{{- $pvcWebhookEnabled := include "vastextensionsmanager.pvc-labels-webhook-enabled" . -}}
{{- $vscrWebhookEnabled := include "vastextensionsmanager.vscr-validation-webhook-enabled" . -}}
{{- $vvrWebhookEnabled := include "vastextensionsmanager.vvr-validation-webhook-enabled" . -}}
{{- $ns := include "vast.common.namespace" . | trimAll "\"" }}
{{- $svcName := include "vastextensionsmanager.webhookServiceName" . }}
{{- $secretName := include "vastextensionsmanager.webhookTLSSecretName" . }}
{{- $cn := printf "%s.%s.svc" $svcName $ns }}
{{- $altNames := list $cn (printf "%s.%s.svc.cluster.local" $svcName $ns) }}
{{- $certs := dict }}
{{- $labels := printf "%s\napp.kubernetes.io/component: vast-extensions-manager" (include "vast.common.labels" . | trim) }}
{{- if not $wh.certManager.enabled }}
{{ include "vast.common.resource.selfSignedCertificate" (dict
  "secretName" $secretName
  "namespace" $ns
  "cn" $cn
  "altNames" $altNames
  "caName" "vast-extensions-manager-webhook-ca"
  "days" (include "vast.common.certs.defaultValidityDays" . | int)
  "labels" $labels
  "out" $certs
) }}
---
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ $svcName }}
  labels:
{{ $labels | nindent 4 }}
{{- if $wh.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ include "vastextensionsmanager.webhookInjectCAFrom" . }}
{{- end }}
webhooks:
{{- if $pvcWebhookEnabled }}
  - name: pvc-label-injector.vastdata.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ $repWh.pvcLabels.failurePolicy | default "Fail" }}
    timeoutSeconds: {{ $repWh.pvcLabels.timeoutSeconds | default 30 }}
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /mutate-pvc
{{- if not $wh.certManager.enabled }}
      caBundle: {{ $certs.caCrt }}
{{- end }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["persistentvolumeclaims"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public"]
{{- end }}
{{- if $vscrWebhookEnabled }}
  - name: vaststorageclassreplication.vastdata.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ $repWh.vastStorageClassReplication.failurePolicy | default "Fail" }}
    timeoutSeconds: {{ $repWh.vastStorageClassReplication.timeoutSeconds | default 30 }}
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate-vastdata-com-v1alpha1-vaststorageclassreplication
{{- if not $wh.certManager.enabled }}
      caBundle: {{ $certs.caCrt }}
{{- end }}
    rules:
      - apiGroups: ["vastdata.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["vaststorageclassreplications"]
{{- end }}
{{- if $vvrWebhookEnabled }}
  - name: vastvolumereplication.vastdata.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ $repWh.vastVolumeReplication.failurePolicy | default "Fail" }}
    timeoutSeconds: {{ $repWh.vastVolumeReplication.timeoutSeconds | default 30 }}
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate-vastdata-com-v1alpha1-vastvolumereplication
{{- if not $wh.certManager.enabled }}
      caBundle: {{ $certs.caCrt }}
{{- end }}
    rules:
      - apiGroups: ["vastdata.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["vastvolumereplications"]
{{- end }}
