####################
# COMMON
####################

driverType: "nfs" # Supported values: "nfs", "block"
# Reference to installed VastDriver CRD
provisioner: ""
# The name of the Secret that stores the VMS credentials.
# Note: The Secret must be created manually unless it is generated automatically by creating a VastCluster.
secretName: ""
# Secret namespace. If not specified, the Secret will be looked up in the same namespace where the Operator is running.
secretNamespace: ""
# Reference to installed VastCluster CRD - One of secretName or clusterName must be provided
clusterName: ""

####################
# VAST CSI STORAGE CLASS OPTIONS (COMMON)
####################

# Name of VAST VIP pool to use - must be provided by user
vipPool: ""
# The FQDN of the VIP pool to use. Must specify either vipPool or vipPoolFQDN.
# Using a DNS skips an API call to the VMS for obtaining a random VIP from the vipPool, leading to faster volume mounting.
# NOTE: The driver will prepend the FQDN with a random prefix, which forces the NFS client to resolve into a different VIP,
# thereby distributing the load across the entire range of the VIP pool.
vipPoolFQDN: ""
# vipPoolFQDNRandomPrefix helps distribute load across the entire VIP pool by randomizing the VIP resolved for each volume mount.
# If set to true, a random prefix will be added to the VIP FQDN, ensuring that each NFS mount request resolves to a different VIP from the VIP pool.
vipPoolFQDNRandomPrefix: true
# Allows resizing existing volumes
allowVolumeExpansion: true
# If true, sets Vast CSI as the cluster-wide storage class default
setDefaultStorageClass: false
# String template for CSI-provisioned volume names, within VAST
volumeNameFormat: "csi:{id}:{namespace}:{name}"
# String template for CSI-provisioned ephemeral volumes, within VAST
ephemeralVolumeNameFormat: "csi:{id}:{namespace}:{name}"
# Add any extra NFS options desired here
mountOptions: []
# Reclaim policy to use with the storage class.
reclaimPolicy: "Delete"


####################
# VAST CSI STORAGE CLASS OPTIONS (NFS)
####################

# Where volumes will be located on VAST - must be provided by user
storagePath: ""
# VAST policy name to create views - must be provided by user
viewPolicy: ""
# Name of QoS policy associates with the view or volume.
qosPolicy: ""
# Enables encryption using LUKS on the device on the client side.
# If set to true, the CSI driver will expect a passphrase to be provided
# with the vast-mgmt secret.

# Example Kubernetes Secret for host encryption:
# kubectl create secret generic vast-mgmt --from-literal=username='' --from-literal=password='' --from-literal=endpoint='' --from-literal=passphrase=''

# Ensure the StorageClass has the following parameters set when host Encryption is true:
# Optional host encryption parameters (will default if not specified):
#   cipher: "aes-xts-plain64"           # Encryption cipher
#   key_size: "512"                     # Key size in bits (e.g., 256 or 512)
#   hash: "sha256"                      # Hashing algorithm
#   pbkdf_memory: "65536"               # Memory cost for PBKDF in KB
#
# Optional LUKS performance flags for cryptsetup open (defaults are enabled):
#   perf-same_cpu_crypt: true            # Use same CPU for encryption work (set to false to disable)
#   perf-submit_from_crypt_cpus: true    # Submit IO from crypt CPUs (set to false to disable)
#   perf-no_read_workqueue: true         # Bypass read workqueue (set to false to disable)
#   perf-no_write_workqueue: true        # Bypass write workqueue (set to false to disable)
#
# Disable read/write workqueues while keeping other perf flags on:
#   hostEncryption:
#     perf-no_read_workqueue: false
#     perf-no_write_workqueue: false
#
# Fully explicit configuration with defaults shown (override as needed):
#   hostEncryption:
#     cipher: "aes-xts-plain64"
#     key_size: "512"
#     hash: "sha256"
#     pbkdf_memory: "65536"
#     perf-same_cpu_crypt: true
#     perf-submit_from_crypt_cpus: true
#     perf-no_read_workqueue: true
#     perf-no_write_workqueue: true
hostEncryption: null

####################
# VAST CSI STORAGE CLASS OPTIONS (BLOCK)
####################

# Subsystem name - must be provided by user
subsystem: ""
# Tenant name – required for additional filtering when multiple subsystems share the same name.
tenantName: ""
# Optional template for constructing the volume group name.
# It supports placeholders for the PVC name, namespace, and ID,
# which can be used in the format {namespace}, {name}, and {id}.
# If not provided, a default template will be used. The volume group
# can represent nested folder structures. For example:
#   - "folder1/folder2/block-{namespace}-{id}
volumeGroup: ""
# Filesystem type to format the volume during creation.
# Allowed values:
#   - ext4: Ext4 filesystem
#   - ext3: Ext3 filesystem
#   - xfs: XFS filesystem
fsType: ""
# Host connectivity type used for block storage.
# Allowed values:
#   - TCP
#   - RDMA
# Default: TCP
transportType: "TCP"
# If true, the CSI driver will wait for the GSS (global snapshot stream) process to fully complete
# before returning from a volume clone operation.
# This ensures the volume is fully usable and consistent at the time of provisioning, but may add
# significant latency if the underlying GSS operation is long-running.
#
# Unset by default (driver non-blocking). StorageClass parameters are immutable — only set
# true/false when creating a new StorageClass (or after deleting the existing one).
# blockingClones: true

# When true, NVMe host NQNs use HMAC-SHA256 instead of the plain node name suffix.
# Requires host_nqn_seed in the StorageClass controller-publish secret.
# Use one seed per VAST tenant; existing block hosts keep their NQN until recreated.
# Unset by default (driver plain NQN). SC parameters are immutable — set only on new SC.
# hostNqnObfuscation: true

####################
# VAST CSI SNAPSHOT CLASS OPTIONS
####################

createSnapshotClass: true

snapshotClass:
  # If true, sets SnapshotClass as the cluster-wide snapshot class default
  setDefaultSnapshotClass: false
  # String template for CSI-provisioned snapshot names, within VAST
  snapshotNameFormat: "csi:{id}:{namespace}:{name}"
  # On snapshot delete behavior. By default, Vast Cluster snapshot will be removed as well.
  deletionPolicy: "Delete"
