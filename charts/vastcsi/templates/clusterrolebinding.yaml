{{- if .Values.rbac }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name | replace "." "-" }}-vast-provisioner-binding
  labels:
    {{- include "vastcsi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name | replace "." "-" }}-vast-controller-sa
    namespace: {{ include "vastcsi.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name | replace "." "-" }}-vast-provisioner-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name | replace "." "-" }}-vast-attacher-binding
  labels:
    {{- include "vastcsi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name | replace "." "-" }}-vast-controller-sa
    namespace: {{ include "vastcsi.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name | replace "." "-" }}-vast-attacher-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name | replace "." "-" }}-resizer-role
  labels:
    {{- include "vastcsi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name | replace "." "-" }}-vast-controller-sa
    namespace: {{ include "vastcsi.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name | replace "." "-" }}-external-resizer-runner
  apiGroup: rbac.authorization.k8s.io
---
{{- if include "vastcsi.addons-enabled" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-csi-addons-binding
  labels:
    {{- include "vastcsi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-vast-controller-sa
    namespace: {{ include "vastcsi.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-csi-addons-role
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
{{- end -}}
