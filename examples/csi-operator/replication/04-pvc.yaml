# Block PVCs on the primary StorageClass (filesystem mode, RWO).
# The extension controller groups PVCs for VolumeGroupReplication.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myapp-data-1
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: vastdata-block
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myapp-data-2
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: vastdata-block
---
apiVersion: v1
