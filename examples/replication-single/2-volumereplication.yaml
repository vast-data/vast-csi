---
apiVersion: replication.storage.openshift.io/v1alpha1
kind: VolumeReplication
metadata:
  name: test-volume-replication
  namespace: default
spec:
  # Reference to the VolumeReplicationClass created by Helm
  volumeReplicationClass: vastdata-filesystem-repl
  replicationState: secondary
  
  # Reference to the PVC to replicate
  dataSource:
    kind: PersistentVolumeClaim
    name: test-replicated-pvc

