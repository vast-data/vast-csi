# NFS CSI driver with extension webhook enabled (replication disabled for a lighter cert-test stack).
# Edit image repositories/tags before applying.
apiVersion: storage.vastdata.com/v1
kind: VastCSIDriver
metadata:
  name: csi.vastdata.com
  namespace: vast-csi
spec:
  driverType: nfs
  extensions:
    enabled: true
    devLogging: true
    replication:
      enabled: false
    webhook:
      enabled: true
      disablePvcLabelsWebhook: false
      certManager:
        enabled: false
  image:
    csiVastPlugin:
      repository: docker.io/vastdataorg/csi:v2.6.6
    vastExtensionController:
      repository: docker.io/vastdataorg/csi:v2.6.6-extensions
  # Uncomment when using a private registry:
  # imagePullSecrets:
  #   - name: regcred
