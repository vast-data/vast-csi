stages:
  - build_base
  - build
  - test
  - deploy

# source: packaging/ci.Dockerfile
image: ${AWS_ACCOUNT_ID}.dkr.ecr.eu-west-1.amazonaws.com/dev/vast-csi-base:CI-2024-07-24

variables:
  DOCKER_REGISTRY: ${AWS_ACCOUNT_ID}.dkr.ecr.eu-west-1.amazonaws.com
  IMAGE_NAME: ${AWS_ACCOUNT_ID}.dkr.ecr.eu-west-1.amazonaws.com/dev/vast-csi:${CI_PIPELINE_ID}
  BASE_IMAGE_NAME: ${AWS_ACCOUNT_ID}.dkr.ecr.eu-west-1.amazonaws.com/dev/vast-csi-base:2024-09-10
  # Universal Base Image: https://catalog.redhat.com/software/container-stacks/detail/609560d9e2b160d361d24f98
  IMAGE_NAME_UBI: ${AWS_ACCOUNT_ID}.dkr.ecr.eu-west-1.amazonaws.com/dev/vast-csi:ubi-${CI_PIPELINE_ID}
  BASE_IMAGE_NAME_UBI: 110450271409.dkr.ecr.eu-west-1.amazonaws.com/dev/vast-csi-base:UBI-2024-09-11
  ORION_BRANCH: comet/master


build_csi_base:
  stage: build_base
  script: |
    set -x
    LATEST=${DOCKER_REGISTRY}/dev/vast-csi-base:latest
    if (docker pull $LATEST) ; then
      docker tag $LATEST vast-csi-base:latest  # the cache-source for our subsequent build
    fi
    docker build \
        -t vast-csi-base:dev \
        --cache-from vast-csi-base:latest \
        -f packaging/base_Dockerfile .
    docker tag vast-csi-base:dev ${BASE_IMAGE_NAME}
    docker tag vast-csi-base:dev ${LATEST}
    docker push ${BASE_IMAGE_NAME}
    docker push ${LATEST}
    echo "pushed ${BASE_IMAGE_NAME}"
  when: manual
  tags:
    - vast-dev-builder


build_csi: &build_csi
  stage: build
  variables:
    IMG: $IMAGE_NAME
    BASE_IMG: $BASE_IMAGE_NAME
    LATEST_IMG_TAG: "latest"
  script: |
    set -x
    VERSION=$(cat version.txt)
    TAGGED=$(grep 'the version of the Vast CSI driver' charts/vastcsi/values.yaml | awk '{print $2}')
    if [[ "$TAGGED" != "$VERSION" ]]; then
      echo "version.txt has $VERSION, while our helm chart has $TAGGED (check charts/vastcsi/values.yaml)"
      exit 5
    fi
    LATEST=${DOCKER_REGISTRY}/dev/vast-csi:${LATEST_IMG_TAG}
    if (docker pull $LATEST) ; then
      docker tag $LATEST vast-csi:latest  # the cache-source for our subsequent build
    fi
    /bin/sh -x packaging/build.sh ${BASE_IMG} # --> vast-csi:dev
    docker run vast-csi:dev test
    docker run vast-csi:dev system_info
    docker tag vast-csi:dev ${IMG}
    docker tag vast-csi:dev ${LATEST}
    docker push ${IMG}
    docker push ${LATEST}
    echo "pushed ${IMG}"
  tags:
    - vast-dev-builder


build_csi_ubi:
  << : *build_csi
  variables:
    IMG: $IMAGE_NAME_UBI
    BASE_IMG: $BASE_IMAGE_NAME_UBI
    LATEST_IMG_TAG: "ubi-latest"
  needs:
    - build_csi  # prevent parallel builds due to sanity checks


build_csi_operator:
  stage: build
  script: |
    set -x
    docker login -u ${RH_DOCKER_USER} -p ${RH_DOCKER_PASSWORD} registry.redhat.io
    export CSI_TAG=ubi-${CI_PIPELINE_ID}
    make operator-build
    make operator-push
    make operator-bundle-build
    make operator-bundle-push
  tags:
    - vast-dev-builder

.common_vars: &common_vars
  INSTALL_IMAGE: "prev_version"
  VAST_upgrade_to: $INSTALL_IMAGE
  VAST_COMET__KWARG: csi_plugin_version=${CI_PIPELINE_ID}
  TRIGGER_SOURCE: "vastcsi"


test_csi [latest]: &test_csi
  stage: test
  when: always
  except:
    - /v[\d]\.[\d]+/
  trigger:
    project: dev/orion
    branch: $ORION_BRANCH
    strategy: depend
  allow_failure: true
  variables: *common_vars


test_csi_multicluster [latest]:
  <<: *test_csi
  when: manual
  variables:
    <<: *common_vars
    NUM_SYSTEMS: 2


test_csi_multicluster [ubi-latest]:
  <<: *test_csi
  when: manual
  variables:
    <<: *common_vars
    NUM_SYSTEMS: 2
    VAST_COMET__KWARG: csi_plugin_version=ubi-${CI_PIPELINE_ID}


test_csi:
  <<: *test_csi
  when: manual
  allow_failure: true
  except: null
  parallel:
    matrix:
      - INSTALL_IMAGE: "4.5"
      - INSTALL_IMAGE: "4.6"
      - INSTALL_IMAGE: "4.7"
      - INSTALL_IMAGE: "5.0"
      - INSTALL_IMAGE: "5.1"
      - INSTALL_IMAGE: "prev_version"
      - INSTALL_IMAGE: "latest"


update_dockerhub [prod]: &update_dockerhub
  stage: deploy
  environment: prod
  only:
    - /v[\d]\.[\d]+/
  script: |
    set -x
    VERSION=$(cat version.txt)
    BASE_IMG=$BASE_IMAGE_NAME
    if [[ "$CI_ENVIRONMENT_NAME" == *"ubi"* ]]; then
        VERSION=ubi-$VERSION
        BASE_IMG=$BASE_IMAGE_NAME_UBI
    fi
    if [[ "$CI_ENVIRONMENT_NAME" != "prod" ]]; then
      VERSION=$VERSION-$CI_ENVIRONMENT_NAME-$CI_PIPELINE_ID
    fi
    RELEASE_NAME=docker.io/vastdataorg/csi:${VERSION}
    docker login -u ${DOCKER_USER} -p ${DOCKER_PASSWORD} $DOCKER_HUB
    /bin/sh -x packaging/push_multi_arch.sh ${BASE_IMG} ${RELEASE_NAME}

  after_script:
  - docker logout $DOCKER_HUB
  when: manual
  tags:
    - vast-dev-builder


update_dockerhub [beta]:
  <<: *update_dockerhub
  environment: beta


update_dockerhub [ubi-prod]:
  <<: *update_dockerhub
  environment: ubi-prod


update_dockerhub [ubi-beta]:
  <<: *update_dockerhub
  environment: ubi-beta


update_github [prod]:  &update_github
  image:
    name: alpine/git
    entrypoint: [""]
  stage: deploy
  only:
    - /^v[\d]\.[\d]+/
  script: |
    set -x
    VERSION=$(cat version.txt)

    mkdir ~/.ssh/
    cp $GITHUB_KEY ~/.ssh/id_rsa
    chmod 0600 ~/.ssh/id_rsa
    ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
    git config --global user.email "ofer.koren@vastdata.com"
    git config --global user.name "Ofer Koren"

    git remote -v
    git remote add github git@github.com:vast-data/vast-csi.git || true
    git fetch github $CI_COMMIT_REF_NAME
    git checkout -B $CI_COMMIT_REF_NAME FETCH_HEAD
    git checkout $CI_COMMIT_SHA -- .
    git commit -am "VAST Data CSI Plugin - $VERSION

      (from $CI_COMMIT_SHA)"

    git tag -f $VERSION
    git push -f --tags github HEAD:$CI_COMMIT_REF_NAME

  when: manual
  tags:
    - vast-dev-builder


update_github [beta]:
  <<: *update_github
  only:
    - /v[\d]\.[\d]+-beta.*/


mark_stable:
  image: 
    name: amazon/aws-cli
    entrypoint: [""]
  stage: deploy
  script: ./scripts/aws_retag_image.sh ${IMAGE_NAME} stable
  tags:
    - vast-dev-builder
  when: manual
